async function apiCall(m,p,b,opt={}){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),opt.timeout||12000);
  try{const r=await fetch(API_URL+"/"+p,{method:m,signal:ctl.signal,keepalive:!!opt.keepalive,headers:{"Content-Type":"application/json",...(AUTH?{Authorization:"Bearer "+AUTH.token}:{})},body:b?JSON.stringify(b):undefined});
    let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error||"http");e.code=j.error||"http";e.status=r.status;throw e}return j}
  catch(e){if(!e.code){e.code="net"}throw e}finally{clearTimeout(t)}}
const _lsSet=Storage.prototype.setItem,_lsRemove=Storage.prototype.removeItem;let syncDirty=new Set(),syncT=null;
Storage.prototype.setItem=function(k,v){_lsSet.call(this,k,v);if(this===window.localStorage&&AUTH&&SYNC_RE.test(k))markDirty(k)};
Storage.prototype.removeItem=function(k){_lsRemove.call(this,k);if(this===window.localStorage&&AUTH&&SYNC_RE.test(k))markDirty(k)};
function markDirty(k){syncDirty.add(k);clearTimeout(syncT);syncT=setTimeout(()=>syncPush(),4000)}
async function syncPush(keepalive){if(!AUTH||!API_OK||!syncDirty.size)return;const keys=[...syncDirty];syncDirty.clear();const data={};
  keys.forEach(k=>{const v=localStorage.getItem(k);try{data[k]=v===null?null:JSON.parse(v)}catch(e){}});
  try{await apiCall("PUT","progress",{data},{keepalive})}catch(e){if(e.status===401)return authExpired();keys.forEach(k=>syncDirty.add(k));clearTimeout(syncT);syncT=setTimeout(()=>syncPush(),30000)}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")syncPush(true)});
function mergeProg(k,a,b){if(a==null)return b;if(b==null)return a;const mx=(x,y)=>{const o={...y};for(const i in x)o[i]=typeof x[i]==="number"?Math.max(x[i],o[i]||0):(o[i]??x[i]);return o};
  if(k==="lessons_done"||k==="mock_best"||k==="mins"||k==="stats"||k.startsWith("res_"))return mx(a,b);
  if(k==="srs"){const o={...b};for(const i in a){const x=a[i],y=o[i];if(!y||(x.r||0)>(y.r||0)||((x.r||0)===(y.r||0)&&(x.d||0)>(y.d||0)))o[i]=x}return o}
  if(k==="xp"){const days={...(b.days||{})};for(const d in (a.days||{}))days[d]=Math.max(a.days[d],days[d]||0);return {total:Math.max(a.total||0,b.total||0),days}}
  if(k==="badges"||k==="dg_done"){const o={...b};for(const i in a)o[i]=o[i]?Math.min(o[i],a[i]):a[i];return o}
  if(k==="mistakes"&&Array.isArray(a)&&Array.isArray(b)){const m=new Map();b.forEach(x=>m.set(x.k,x));a.forEach(x=>{const y=m.get(x.k);if(!y||(x.t||0)>(y.t||0))m.set(x.k,x)});return [...m.values()].slice(-400)}
  if(k==="srs_streak")return (a.last||0)!==(b.last||0)?((a.last||0)>(b.last||0)?a:b):((a.n||0)>=(b.n||0)?a:b);
  if(k==="srs_day")return a.day!==b.day?(a.day>b.day?a:b):{day:a.day,n:Math.max(a.n||0,b.n||0)};
  if(k==="placement")return (a.date||0)>=(b.date||0)?a:b;
  return a}
async function syncPull(pushAll){const r=await apiCall("GET","progress");const keys=new Set(Object.keys(r.data||{}));
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(SYNC_RE.test(k))keys.add(k)}
  keys.forEach(k=>{let loc=null;try{loc=JSON.parse(localStorage.getItem(k)||"null")}catch(e){}const srv=(r.data||{})[k]??null;const m=mergeProg(k,loc,srv);
    if(m==null)return;const s=JSON.stringify(m);_lsSet.call(localStorage,k,s);if(pushAll||s!==JSON.stringify(srv))syncDirty.add(k)});
  CARDIDX=null;await syncPush();const y=window.scrollY;render();renderDrawer();window.scrollTo(0,y)}
function authExpired(){AUTH=null;lsSet("auth",null);toast(AUTH_ERR.auth);renderDrawer()}
async function accountInit(){if(!API_URL)return;try{const r=await fetch(API_URL+"/health",{cache:"no-store"});API_OK=r.ok&&(await r.json()).ok===true}catch(e){API_OK=false}
  if(!API_OK){if(AUTH)renderDrawer();return}
  if(AUTH){try{const me=await apiCall("GET","me");AUTH={...AUTH,...me.user};lsSet("auth",AUTH);await syncPull(false)}catch(e){if(e.status===401)authExpired()}}
  renderDrawer()}

  syncPush(true).finally(()=>{const t=AUTH&&AUTH.token;if(t)fetch(API_URL+"/auth/logout",{method:"POST",headers:{Authorization:"Bearer "+t}}).catch(()=>{});
    AUTH=null;lsSet("auth",null);const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(SYNC_RE.test(k))ks.push(k)}ks.forEach(k=>_lsRemove.call(localStorage,k));
    CARDIDX=null;toast("سُجّل خروجك.");go({name:"home"});renderDrawer()})}

let pt=null;
function getPlace(){return lsGet("placement",null)}
function ptSave(){lsSet("pt_state",pt)}
function ptMk(q){const o=shuffleA([q[1]].concat(q[2]));return {q:q[0],o,a:o.indexOf(q[1])}}
function ptCanListen(){return "speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined"}
function ptStage(k){const S=PT[k];return {k,part:"g",i:0,g:shuffleA(S.g).slice(0,PT_G).map(ptMk),r:S.r.q.map(ptMk),l:S.l.q.map(ptMk),ga:{},ra:{},la:{},plays:0,noL:!ptCanListen()}}
function ptStart(){pt={st:ptStage(0),res:[],done:false,t0:Date.now()};ptSave()}
function ptScore(st){const c=(qs,an)=>qs.filter((q,i)=>an[i]===q.a).length;
  const g=c(st.g,st.ga),r=c(st.r,st.ra),l=st.noL?null:c(st.l,st.la);
  const tot=st.g.length+st.r.length+(st.noL?0:st.l.length),ok=g+r+(l||0);
  return {lv:PT[st.k].lv,g,gt:st.g.length,r,rt:st.r.length,l,lt:st.noL?0:st.l.length,p:Math.round(ok/tot*100)}}
function ptEndStage(){const sc=ptScore(pt.st);pt.res.push(sc);
  if(sc.p/100>=PT_PASS&&pt.st.k<PT.length-1){pt.st=ptStage(pt.st.k+1)}else ptFinish();ptSave()}
function ptFinish(){const passed=pt.res.filter(r=>r.p/100>=PT_PASS).length;
  const start=Math.min(passed*2,LEVELS.length-2);
  pt.done=true;pt.start=start;pt.band=passed?PT[passed-1].lv:"0";pt.min=Math.max(1,Math.round((Date.now()-pt.t0)/60000));
  lsSet("placement",{start,band:pt.band,scores:pt.res.map(r=>r.p),detail:pt.res,date:today()});
  const b=LEVELS[start].id.slice(0,2),ids=DICT.map(d=>d.id),dl=ids.includes(b)?b:ids[ids.length-1];
  const c=lsGet("srs_cfg",{});if(Object.keys(srsAll()).length===0){c.lv=dl;lsSet("srs_cfg",c)}}
function ptListen(btn){const st=pt.st;if(st.plays>=2)return;const T=PT[st.k].l.t;st.plays++;ptSave();
  try{speechSynthesis.cancel()}catch(e){}
  const u=new SpeechSynthesisUtterance(T);u.lang="de-DE";u.rate=st.k<2?.85:.95;const v=deVoiceObj();if(v)u.voice=v;else if(VOICES.length&&!warnedVoice){warnedVoice=true;voiceIssue("novoice")}
  let started=false;u.onstart=()=>{started=true;if(btn){btn.disabled=true;btn.innerHTML=`${icon("pause")} يُقرأ…`}};
  u.onend=()=>{renderPlacement()};u.onerror=e=>{if(e.error==="interrupted"||e.error==="canceled")return;voiceIssue("error");renderPlacement()};
  speechSynthesis.speak(u);setTimeout(()=>{if(!started){voiceIssue("silent");renderPlacement()}},4000)}
function ptOpt(name,o,oi,sel){return `<label class="opt" style="direction:${isDe(o)?"ltr":"rtl"};font-family:${isDe(o)?"var(--de)":"var(--ar)"}"><input type="radio" name="${name}" value="${oi}" ${sel===oi?"checked":""}>${esc(o)}</label>`}
function ptProgress(){const st=pt.st,parts=["g","r","l"].filter(p=>!(p==="l"&&st.noL)),pi=parts.indexOf(st.part);
  const names={g:"القواعد والمفردات",r:"القراءة",l:"الاستماع"};
  return `<div style="display:flex;justify-content:space-between;margin:8px 0" class="small muted"><span>المرحلة ${st.k+1} من ${PT.length}: ${PT[st.k].lv}</span><span>${names[st.part]}${st.part==="g"?` · ${st.i+1} من ${st.g.length}`:""}</span></div>
  <div style="display:flex;gap:4px;margin-bottom:6px">${PT.map((p,k)=>{const f=k<st.k?100:k>st.k?0:Math.round(((pi+(st.part==="g"?st.i/st.g.length:0))/parts.length)*100);return `<div title="${p.lv}" style="flex:1;height:6px;border-radius:3px;background:linear-gradient(to left,var(--das) ${f}%,var(--line) 0)"></div>`}).join("")}</div>
  <div style="display:flex;gap:4px;margin-bottom:18px" class="small muted">${PT.map(p=>`<span style="flex:1;text-align:center;font-family:var(--de)">${p.lv}</span>`).join("")}</div>`}
function renderPlacement(){
  const prev=getPlace();
  if(!pt){const saved=lsGet("pt_state",null);if(saved&&!saved.done&&saved.st){pt=saved;pt.intro=true;pt.resume=true}}

    const resumable=pt&&pt.intro&&pt.resume;
    app.innerHTML=`<button class="back" data-nb>→ رجوع</button><h1>اختبار تحديد المستوى</h1>
    <p class="lead">اختبار شامل يقيس القواعد والمفردات والقراءة والاستماع، ويحدد مستواك من A1 حتى C1 على أساس الإطار الأوروبي المرجعي للغات.</p>

    ${ptCanListen()?"":`<p class="tip">جهازك لا يدعم النطق، لذا سيُحذف جزء الاستماع وتُحسب النتيجة على القواعد والقراءة فقط.</p>`}

    <div class="row-btns">${resumable?`<button class="btn primary" id="ptRes" style="flex:1">تابع من حيث توقفت</button><button class="btn" id="ptGo">ابدأ من جديد</button>`:`<button class="btn primary" id="ptGo" style="flex:1">${prev?"أعد الاختبار":"ابدأ الاختبار"}</button>`}</div>`;

  if(pt.done)return renderPtResult();

  const exitBtn=`<button class="back" id="ptExit">→ خروج (سيُحفظ مكانك)</button>`;
  if(st.part==="g"){const q=st.g[st.i],sel=st.ga[st.i];
    app.innerHTML=`${exitBtn}${ptProgress()}<fieldset class="q" style="border:0;padding:0"><legend class="qt" style="direction:rtl;text-align:right;font-family:var(--ar);font-size:19px;line-height:1.7">${bidiHTML(q.q)}</legend>
    ${q.o.map((o,oi)=>ptOpt("ptq",o,oi,sel)).join("")}</fieldset>

    app.querySelectorAll("input[name=ptq]").forEach(r=>r.onchange=()=>{st.ga[st.i]=+r.value;app.querySelectorAll("label.opt").forEach((l,li)=>{const on=li===+r.value;l.style.borderColor=on?"var(--ink)":"";l.style.background=on?"var(--surface-2)":"";l.style.fontWeight=on?"700":""});$("#ptNext").disabled=false});
    const adv=()=>{st.i++;if(st.i>=st.g.length){st.part="r"}ptSave();renderPlacement();window.scrollTo(0,0)};
    $("#ptNext").onclick=adv;$("#ptSkip").onclick=()=>{st.ga[st.i]=-1;adv()};
  }else{

    app.innerHTML=`${exitBtn}${ptProgress()}
    <h2 style="margin:0 0 8px">${isR?"اقرأ النص وأجب":"استمع وأجب"}</h2>

      :`<div class="box" style="text-align:center"><p class="muted small" style="margin:0 0 12px">سيُقرأ النص بالألمانية. يمكنك الاستماع إليه مرتين على الأكثر. اقرأ الأسئلة أولًا قبل الاستماع.</p><button class="btn primary" id="ptPlay" ${st.plays>=2?"disabled":""}>${icon("play")} ${st.plays===0?"استمع إلى النص":st.plays===1?"استمع مرة أخرى":"انتهت مرات الاستماع"}</button><p class="small muted" style="margin:10px 0 0">مرات الاستماع: ${st.plays} من 2</p></div>`}

function renderPtResult(){if(!pt.xp){pt.xp=1;addXP(20,true);stInc("placed",0)}if(!pt.cel&&pt.band!=="0"){pt.cel=1;setTimeout(()=>celebrate("مستواك "+pt.band,"ابدأ من "+LEVELS[pt.start].id),300)}
  const L=LEVELS[pt.start],band=pt.band,names={"0":"مبتدئ",A1:"مبتدئ",A2:"أساسي",B1:"متوسط",B2:"فوق المتوسط",C1:"متقدم"};

  <p>${PT_CAN[band]}</p>

  <h2>النتيجة بالتفصيل</h2>

  ${sk.map(([n,v])=>`<div style="margin:0 0 12px"><div style="display:flex;justify-content:space-between" class="small"><span>${n}</span><b data-cu="${v}" data-suf="%">${v}%</b></div><div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden"><div style="height:100%;width:${v}%;background:${v>=60?"var(--das)":"var(--warn)"}"></div></div></div>`).join("")}

function mkGet(){return lsGet("mistakes",[])}
function mkSave(a){lsSet("mistakes",a.slice(-400))}

let tp={on:false,key:null,i:0},tpSlow=false,tpTr=true,tpLv=null;
function tpMark(key,i){document.querySelectorAll(".tps,.tpa").forEach(e=>{e.classList.toggle("on",e.dataset.tk===key&&+e.dataset.ti===i)});
  document.querySelectorAll("[data-tpb]").forEach(b=>{const on=tp.on&&b.dataset.tpb===tp.key;b.innerHTML=on?`${icon("pause")} إيقاف`:`${icon("play")} استمع إلى الموضوع كاملًا`;b.classList.toggle("primary",!on)})}
function tpStop(){const was=tp.on;tp.on=false;if(was){try{speechSynthesis.cancel()}catch(e){}}tpMark(null,-1)}
function tpFind(key){const [lv,ix]=key.split("|");return ((typeof TOPICS!=="undefined"&&TOPICS[lv])||[])[+ix]}
function tpPlay(key,start){
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){voiceIssue("nosupport");return}
  const T=tpFind(key);if(!T)return;
  try{speechSynthesis.cancel()}catch(e){}
  tp={on:true,key,i:start||0};const run=++tpRun;
  const next=()=>{if(!tp.on||tp.key!==key||run!==tpRun)return;
    if(tp.i>=T.s.length){tp.on=false;tpMark(null,-1);if(start===0||start===undefined){stInc("topics");addXP(5)}return}
    tpMark(key,tp.i);const idx=tp.i;
    const u=new SpeechSynthesisUtterance(T.s[idx][0]);u.lang="de-DE";u.rate=tpSlow?.7:.9;
    const v=deVoiceObj();if(v)u.voice=v;else if(VOICES.length&&!warnedVoice){warnedVoice=true;voiceIssue("novoice")}
    let started=false;u.onstart=()=>{started=true};
    u.onend=()=>{if(run!==tpRun)return;tp.i=idx+1;setTimeout(next,tpSlow?600:350)};
    u.onerror=e=>{if(e.error==="interrupted"||e.error==="canceled")return;tp.on=false;tpMark(null,-1);voiceIssue("error")};
    try{speechSynthesis.speak(u)}catch(e){tp.on=false;voiceIssue("error")}
    setTimeout(()=>{if(run===tpRun&&tp.on&&tp.i===idx&&!started){tp.on=false;tpMark(null,-1);voiceIssue("silent")}},4000)};
  next()}
let tpRun=0;
function topicsHTML(lv){const list=(typeof TOPICS!=="undefined"&&TOPICS[lv])||[];
  if(!list.length)return `<div class="box" style="text-align:center"><p style="margin:0"><b>موضوعات ${esc(lv)} ستُضاف قريبًا</b></p><p class="muted small" style="margin:6px 0 0">سيحتوي كل مستوى على موضوعات مكتوبة تتحدث عنها، ويمكنك الاستماع إليها.</p></div>`;
  return `<p class="muted small" style="margin:0 0 10px">موضوعات مكتوبة تناسب مستوى ${esc(lv)}، تتحدث عنها في الامتحان وفي الحياة. استمع إلى الموضوع كاملًا، أو اضغط على أي جملة في النص الألماني لتستمع إليها منفردة.</p>
  <div class="row-btns" style="margin:0 0 14px"><button class="chip" id="tpSlow" aria-pressed="${tpSlow}">${tpSlow?"✓ ":""}نطق بطيء</button><button class="chip" id="tpTr" aria-pressed="${tpTr}">${tpTr?"✓ ":""}الترجمة</button></div>
  ${list.map((T,ix)=>{const key=lv+"|"+ix;return `<details class="g tpc"${ix===0?" open":""}><summary><span><span style="display:block">${ix+1}. ${esc(T.t)}</span><span class="small muted" style="font-family:var(--de);direction:ltr;display:block;text-align:right;font-weight:500">${esc(T.de)} · ${T.s.length} جملة</span></span></summary>
  <div class="gb"><div class="row-btns" style="margin:12px 0"><button class="btn primary" data-tpb="${key}" style="flex:1">${icon("play")} استمع إلى الموضوع كاملًا</button></div>
  <p class="tpde" lang="de">${T.s.map((x,i)=>`<span class="tps" data-tk="${key}" data-ti="${i}" tabindex="0" role="button">${esc(x[0])}</span>`).join(" ")}</p>
  ${tpTr?`<p class="tpar">${T.s.map((x,i)=>`<span class="tpa" data-tk="${key}" data-ti="${i}">${esc(x[1])}</span>`).join(" ")}</p>`:""}</div></details>`}).join("")}`}
function bindTopics(root,rerender){
  root.querySelectorAll("[data-tpb]").forEach(b=>b.onclick=e=>{e.preventDefault();const k=b.dataset.tpb;if(tp.on&&tp.key===k)tpStop();else tpPlay(k,0)});
  root.querySelectorAll(".tps").forEach(p=>{const f=()=>{const k=p.dataset.tk,i=+p.dataset.ti;if(tp.on&&tp.key===k){tpPlay(k,i)}else{tpStop();const T=tpFind(k);if(T){tpMark(k,i);speak(T.s[i][0],tpSlow?.7:.9)}}};p.onclick=f;p.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  const s=root.querySelector("#tpSlow");if(s)s.onclick=()=>{tpSlow=!tpSlow;rerender()};
  const t=root.querySelector("#tpTr");if(t)t.onclick=()=>{tpTr=!tpTr;tpStop();rerender()};
  if(tp.on)tpMark(tp.key,tp.i)}
function renderTopicsPage(){
  const ids=LEVELS.map(L=>L.id);if(!tpLv||!ids.includes(tpLv)){const n=planInfo().next;tpLv=n?n.L.id:ids[0]}

  <div class="chips" role="group" aria-label="اختر المستوى">${ids.map(id=>`<button class="chip" data-tl="${id}" aria-pressed="${id===tpLv}">${id}${cnt(id)?` · ${cnt(id)}`:""}</button>`).join("")}</div><div id="tpw"></div>`;
  const W=$("#tpw");const draw=()=>{W.innerHTML=topicsHTML(tpLv);bindTopics(W,draw)};draw();
  app.querySelectorAll("[data-tl]").forEach(b=>b.onclick=()=>{tpStop();tpLv=b.dataset.tl;renderTopicsPage();syncHash()});

function addXP(n,quiet){if(!n||n<0)return;const x=xpGet(),t=today(),before=x.days[t]||0;x.total+=n;x.days[t]=before+n;
  const ks=Object.keys(x.days).map(Number).sort((a,b)=>a-b);if(ks.length>120)ks.slice(0,ks.length-120).forEach(k=>delete x.days[k]);

/* ===== التمرين السريع: أنواع تمارين متنوعة ===== */
let pr=null;
const UML=["ä","ö","ü","ß","Ä","Ö","Ü"];
function nrm(s){return String(s).toLowerCase().replace(/ae/g,"ä").replace(/oe/g,"ö").replace(/ue/g,"ü").replace(/ss/g,"ß").replace(/[.,!?;:"„“()]/g,"").replace(/\s+/g," ").trim()}
function prWords(src){let W=[];
  if(src&&src.words)W=src.words.slice();
  else{const S=srsAll(),I=cardIdx();W=Object.keys(S).filter(id=>I[id]&&S[id].b>=1).map(id=>I[id]);
    if(W.length<8){const n=planInfo().next;W=W.concat(n?n.words:LEVELS[0].words)}
    if(W.length<8)W=W.concat(DICT[0].words.slice(0,40))}
  const seen=new Set();return shuffleA(W.filter(w=>w&&w[1]&&w[2]&&!seen.has(w[1])&&seen.add(w[1])))}
function prBuild(src){const W=prWords(src),items=[];const can=ptCanListen();
  const ex=W.filter(w=>w[4]&&w[4].split(" ").length>=3&&w[4].split(" ").length<=9);
  let wi=0;const take=()=>W[(wi++)%W.length];
  const plan=["type","match","order","listen","type","order","match","listen","type","type"];
  plan.forEach(t=>{if(t==="listen"&&!can)t="type";if(t==="order"&&!ex.length)t="type";
    if(t==="match"){const ws=[];while(ws.length<4&&ws.length<W.length){const w=take();if(!ws.some(x=>x[1]===w[1]))ws.push(w)}if(ws.length>=3)items.push({t,ws,left:shuffleA(ws.map((w,i)=>i)),right:shuffleA(ws.map((w,i)=>i)),done:[]});return}
    if(t==="order"){const w=ex[Math.floor(Math.random()*ex.length)];const toks=w[4].replace(/\s+/g," ").trim().split(" ");items.push({t,w,toks,pool:shuffleA(toks.map((x,i)=>i)),pick:[]});return}
    items.push({t,w:take()})});
  return {src:src||null,items,i:0,ok:0,checked:false,res:null,wrong:[]}}
function prAnswerOf(it){const w=it.w;return w[0]?full(w):w[1]}
function prStart(src){pr=prBuild(src);go({name:"practice"})}
function renderPractice(){
  if(!pr){go({name:"home"});return}

function lessonToSRS(x){const S=srsAll(),t=today(),band=x.L.id.slice(0,2);let n=0;x.words.forEach(w=>{const D=DICT.find(d=>d.id===band&&d.words.some(z=>z[1]===w[1]));const id=D?band+":"+w[1]:"L:"+x.L.id+":"+w[1];if(!S[id]){S[id]={b:0,d:t,r:0,l:0};n++}});lsSet("srs",S);return n}
function srsDueIds(){const S=srsAll(),t=today(),I=cardIdx();return Object.keys(S).filter(id=>I[id]&&S[id].d<=t).sort((a,b)=>S[a].d-S[b].d)}
function srsNewToday(){const x=lsGet("srs_day",{});return x.day===today()?x.n:0}
function srsNewLeft(){return Math.max(0,srsCfg().n-srsNewToday())}
function srsLvStats(id){const S=srsAll();const D=DICT.find(x=>x.id===id);let seen=0,ok=0;D.words.forEach(w=>{const c=S[id+":"+w[1]];if(c){seen++;if(c.b>=4)ok++}});return {total:D.words.length,seen,ok}}
function srsStreak(){const s=lsGet("srs_streak",{last:0,n:0});return s.last>=today()-1?s.n:0}
function srsBump(){const s=lsGet("srs_streak",{last:0,n:0}),t=today();if(s.last===t)return;s.n=s.last===t-1?s.n+1:1;s.last=t;lsSet("srs_streak",s)}
function ivTxt(d){return d<=0?"الآن":d===1?"غدًا":d===2?"بعد يومين":d<11?`بعد ${d} أيام`:d<30?`بعد ${d} يوم`:d<60?"بعد شهر":`بعد ${Math.round(d/30)} أشهر`}
function srsNext(c,g){const b=c?c.b:0;if(g===0)return {b:0,iv:0};if(g===1){const nb=Math.max(1,b);return {b:nb,iv:Math.max(1,Math.round(SRS_IV[nb]/2))}}const nb=Math.min(c?b+1:2,SRS_IV.length-1);return {b:nb,iv:SRS_IV[nb]}}
let sess=null,cardsMode="dash";
function startSess(){const cfg=srsCfg(),S=srsAll(),I=cardIdx();
  const due=srsDueIds().slice(0,100);
  const D=DICT.find(x=>x.id===cfg.lv)||DICT[0];
  const fresh=shuffleA(D.words.filter(w=>!S[D.id+":"+w[1]])).slice(0,srsNewLeft()).map(w=>D.id+":"+w[1]);
  const q=[];let i=0,j=0;while(i<due.length||j<fresh.length){if(i<due.length)q.push(due[i++]);if(i<due.length)q.push(due[i++]);if(j<fresh.length)q.push(fresh[j++])}
  sess={q,i:0,flip:false,newSet:new Set(fresh),res:[0,0,0],total:q.length};
}
function gradeCard(g){buzz(g===0?[40,40,40]:12);addXP(1,true);const id=sess.q[sess.i],S=srsAll(),c=S[id];const nx=srsNext(c,g),t=today();
  if(!c&&sess.newSet.has(id)){const x=lsGet("srs_day",{});lsSet("srs_day",{day:t,n:(x.day===t?x.n:0)+1});sess.newSet.delete(id)}
  S[id]={b:nx.b,d:t+nx.iv,r:((c&&c.r)||0)+1,l:((c&&c.l)||0)+(g===0?1:0)};lsSet("srs",S);

  const due=srsDueIds().length,left=srsNewLeft(),D=DICT.find(x=>x.id===cfg.lv)||DICT[0],st=srsLvStats(D.id);
  const newAvail=Math.min(left,st.total-st.seen),tot=due+newAvail,streak=srsStreak();

let verbLv="all",verbQ="",verbTab="list",vq=null,cjQ="";
function auxW(a){return a==="s"?"ist":a==="h"?"hat":"hat / ist"}
function verbRow(v){return `<li class="row"><div class="txt"><span class="w" style="display:block;font-family:var(--de);direction:ltr;text-align:left;font-weight:700">${esc(v[0])} <span style="font-weight:400;color:var(--muted)">· er ${esc(v[1])}</span></span><span class="w" style="display:block;font-family:var(--de);direction:ltr;text-align:left">${esc(v[2])} <span style="color:var(--muted)">→</span> <span style="color:${v[3]==="s"?"var(--die)":v[3]==="h"?"var(--der)":"var(--das)"}">${auxW(v[3])}</span> ${esc(v[4])}</span><span class="meaning">${esc(v[5])}</span> <span class="pron">· ${esc(v[6])}</span></div><button class="say" data-say="${esc(v[0]+", "+v[2]+", "+auxW(v[3]).split(" / ")[0]+" "+v[4].split(" / ")[0])}" aria-label="اسمع ${esc(v[0])}">${SPK}</button></li>`}
function verbPool(){return VERBS.filter(v=>verbLv==="all"||v[6]===verbLv)}
function fakePrt(v){const st=v[0].replace(/(e?n)$/,"");return /\s/.test(v[1])||/\s|^(be|ver|er|ent|zer|ge|emp|miss|unter|wider|über)/.test(v[0])?null:st+"te"}
function fakePart(v){const st=v[0].replace(/(e?n)$/,"");return /\s/.test(v[1])||/\s|^(be|ver|er|ent|zer|ge|emp|miss|unter|wider|über)/.test(v[0])?null:"ge"+st+"t"}
function makeVerbQuiz(){const pool=verbPool();const qs=[];
  shuffleA(pool).slice(0,10).forEach(v=>{

    let q,right,cand;

    else if(t===1){q=`التصريف الثالث (Partizip II) من <i>${esc(v[0])}</i>:`;right=v[4];cand=[fakePart(v)].concat(shuffleA(VERBS).map(x=>x[4]))}
    else{q=`<i>${esc(v[0])}</i> في Perfekt: <i>Er ___ ${esc(v[4])}.</i>`;right=v[3]==="s"?"ist":"hat";cand=[right==="ist"?"hat":"ist"]}
    const wrong=[];cand.forEach(c=>{if(c&&c!==right&&!wrong.includes(c)&&wrong.length<(t===2?1:3))wrong.push(c)});
    const opts=shuffleA([right].concat(wrong));
    qs.push({q,opts,a:opts.indexOf(right),e:`${v[0]} – ${v[2]} – ${auxW(v[3])} ${v[4]} (${v[5]})`})});
  return {qs,ans:{},checked:false}}

  }else{

const ROUTED=["practice","dialogs","mock","stats","topics","mistakes","placement","home","level","lesson","dict","themes","theme","sent","chat","photo","media","art","intro","search","verbs","cards"];
function viewHash(v){
  const n=v.name||"home",L=LEVELS[v.lvl];
  if(n==="home")return "#/";
  if(n==="level")return "#/level/"+(L?L.id:"A1.1")+(v.tab&&v.tab!=="words"?"/"+v.tab:"");
  if(n==="lesson")return "#/lesson/"+(L?L.id:"A1.1")+"/"+((v.li|0)+1);
  if(n==="theme")return "#/theme/"+encodeURIComponent(v.th||"");
  if(n==="art")return "#/art/"+(v.art||"m");
  if(n==="intro")return "#/intro/"+(v.tab||"abc");
  if(n==="dialogs")return "#/dialogs"+(dgOpen?"/"+dgOpen:"");
  if(n==="topics")return "#/topics"+(tpLv?"/"+tpLv:"");
  if(n==="cards")return "#/cards"+(cardsMode==="sess"?"/review":"");
  if(n==="search")return "#/search"+(sq?"/"+encodeURIComponent(sq):"");
  return "#/"+n}
function parseHash(h){
  const p=String(h||"").replace(/^#\/?/,"").split("/").map(x=>{try{return decodeURIComponent(x)}catch(e){return x}});
  const n=p[0]||"home";if(!ROUTED.includes(n))return {name:"home"};
  const lv=id=>{const i=LEVELS.findIndex(L=>L.id===id);return i<0?0:i};
  if(n==="level")return {name:n,lvl:lv(p[1]),tab:["words","lessons","exam","grammar","topics"].includes(p[2])?p[2]:"words",part:"r"};
  if(n==="lesson"){const l=lv(p[1]),li=Math.max(0,(parseInt(p[2],10)||1)-1);return {name:n,lvl:l,li:Math.min(li,LEVELS[l].grammar.length-1)}}
  if(n==="theme")return THEMES.some(t=>t.id===p[1])?{name:n,th:p[1]}:{name:"themes"};
  if(n==="art")return {name:n,art:["m","f","n"].includes(p[1])?p[1]:"m"};
  if(n==="intro")return {name:n,tab:p[1]==="num"?"num":"abc"};
  if(n==="dialogs"){dgOpen=p[1]&&DIALOGS.some(d=>d.id===p[1])?p[1]:null;return {name:n}}
  if(n==="topics"){if(p[1]&&LEVELS.some(L=>L.id===p[1]))tpLv=p[1];return {name:n}}
  if(n==="cards"){if(p[1]==="review"&&sess){cardsMode="sess"}else{cardsMode="dash";sess=null}return {name:n}}
  if(n==="search"){sq=p[1]||"";try{hq.value=sq}catch(e){}return {name:n}}
  return {name:n}}

const LVW_CACHE={};let lvQ="",lvN=150,lvKey="";
function deBase(w){return w[1].replace(/^sich /,"")}
function levelAllWords(i){if(LVW_CACHE[i])return LVW_CACHE[i];
  const L=LEVELS[i],band=L.id.slice(0,2),D=DICT.find(d=>d.id===band);
  const sibs=LEVELS.map((x,j)=>j).filter(j=>LEVELS[j].id.slice(0,2)===band),part=sibs.indexOf(i);
  const sorted=D?D.words.slice().sort((a,b)=>deBase(a).localeCompare(deBase(b),"de",{sensitivity:"base"})):[];
  const per=Math.ceil(sorted.length/sibs.length),mine=sorted.slice(part*per,(part+1)*per);
  const own=new Set(L.words.map(w=>full(w).toLowerCase()));
  const dict=mine.filter(w=>!own.has(full(w).toLowerCase()));
  const r={dict,from:mine.length?deBase(mine[0]):"",to:mine.length?deBase(mine[mine.length-1]):"",band,hasDict:!!D};
  return LVW_CACHE[i]=r}
function levelWordCount(i){return LEVELS[i].words.length+levelAllWords(i).dict.length}

function mcq(L,P,k,ex,S){
  const st=S[k]||(S[k]={ans:{},checked:false,plays:0});
  const isL=k==="l",tts="speechSynthesis" in window;
  let top=isL?(tts?`<div class="box"><p style="margin-top:0">استمع إلى النص (يمكنك الاستماع إليه مرتين)، ثم أجب.</p><div class="row-btns"><button class="btn primary" id="play" ${st.plays>=2&&!st.checked?"disabled":""}>${SPK} شغّل النص</button><span class="muted small">مرات الاستماع: ${st.plays} / 2</span></div>${st.checked?`<details style="margin-top:10px"><summary>اعرض النص</summary><p class="text-de">${esc(ex.text)}</p></details>`:""}</div>`
    :`<div class="box"><p class="muted" style="margin-top:0">جهازك لا يدعم النطق الصوتي، فاقرأ النص بدلًا من الاستماع إليه:</p><p class="text-de">${esc(ex.text)}</p></div>`)
    :`<div class="box"><p class="muted small" style="margin-top:0">اقرأ النص وأجب عن الأسئلة.</p><p class="text-de">${esc(ex.text)}</p></div>`;
  P.innerHTML=top+ex.qs.map((q,qi)=>`<fieldset class="q" style="border:0;padding:0"><legend class="qt">${qi+1}. ${esc(q[0])}</legend>${q[1].map((o,oi)=>{let c="opt";if(st.checked){if(oi===q[2])c+=" right";else if(st.ans[qi]===oi)c+=" wrong"}return `<label class="${c}"><input type="radio" name="q${qi}" value="${oi}" ${st.ans[qi]===oi?"checked":""} ${st.checked?"disabled":""}>${esc(o)}</label>`}).join("")}</fieldset>`).join("")+
  `<div class="row-btns">${st.checked?`<button class="btn" id="retry">أعد هذا الجزء</button>`:`<button class="btn primary" id="check">صحّح</button>`}</div><div class="err" id="err" role="alert"></div>`;
  P.querySelectorAll("input[type=radio]").forEach(i=>i.onchange=()=>{st.ans[+i.name.slice(1)]=+i.value;$("#err").textContent=""});
  const play=$("#play");if(play)play.onclick=()=>{if(st.plays<2||st.checked){if(!st.checked)st.plays++;speak(ex.text,.85);renderLevel()}};
  const ch=$("#check");if(ch)ch.onclick=()=>{
    if(Object.keys(st.ans).length<ex.qs.length){$("#err").textContent="أجب عن جميع الأسئلة أولًا.";return}
    const c=ex.qs.filter((q,i)=>st.ans[i]===q[2]).length;st.checked=true;answerFx(c,ex.qs.length);addXP(10,true);setRes(L.id,k,Math.round(c/ex.qs.length*25));{const wr=[];ex.qs.forEach((q,i)=>{if(st.ans[i]!==q[2])wr.push({src:"exam",from:L.id+" · امتحان "+(k==="l"?"الاستماع":"القراءة"),q:esc(q[0]),o:q[1],a:q[2],e:"",ctx:ex.text,listen:k==="l",go:{name:"level",lvl:view.lvl,tab:"exam",part:k}})});mkAdd(wr)}renderLevel()};
  const rt=$("#retry");if(rt)rt.onclick=()=>{S[k]={ans:{},checked:false,plays:0};renderLevel()};
}

function fallbackScore(text,min){const n=wc(text);return Math.min(25,Math.round(20*Math.min(1,n/min))+(n>=min?5:0))}
function feedbackHTML(st,model){
  if(!st.result)return "";const r=st.result;
  return `<div class="feedback"><p style="margin-top:0"><b>الدرجة: ${r.score} / 25</b></p>${r.feedback?`<p>${esc(r.feedback)}</p>`:""}${r.corrected?`<p class="small muted">النسخة المصححة:</p><p class="text-de">${esc(r.corrected)}</p>`:""}${r.ai?"":`<p class="small muted">التصحيح الذكي غير متاح هنا، لذا فالدرجة تقدير تقريبي حسب طول الإجابة. قارن إجابتك بالنموذج:</p>`}${model?`<details><summary>إجابة نموذجية</summary><p class="text-de">${esc(model)}</p></details>`:""}</div>`;
}

    st.busy=true;st.result=null;renderLevel();

  };
}

function bidiHTML(h){return String(h).split("<br>").map(part=>{const t=part.replace(/<[^>]+>/g,"");const m=t.match(/[A-Za-zÄÖÜäöüß\u0600-\u06FF]/);const ltr=m&&!/[\u0600-\u06FF]/.test(m[0]);return `<span dir="${ltr?"ltr":"rtl"}" style="display:block;text-align:${ltr?"left":"right"};font-family:${ltr?"var(--de),var(--ar)":"var(--ar)"}">${part}</span>`}).join("")}
function isDe(o){return !/[\u0600-\u06FF]/.test(o)&&/[A-Za-zÄÖÜäöüß]/.test(o)}
function lessonsOf(i){const L=LEVELS[i],n=L.grammar.length,per=Math.ceil(L.words.length/n);return L.grammar.map((g,li)=>({L,lvl:i,li,g,words:L.words.slice(li*per,(li+1)*per)}))}
function getDone(){try{return JSON.parse(localStorage.getItem("lessons_done")||"{}")}catch(e){return {}}}
function setDone(id,score){const d=getDone();d[id]=Math.max(score,d[id]||0);try{localStorage.setItem("lessons_done",JSON.stringify(d))}catch(e){}}
function planInfo(){const d=getDone();const pp=lsGet("placement",null),st=pp?pp.start:0;let total=0,done=0,next=null;LEVELS.forEach((L,i)=>lessonsOf(i).forEach(x=>{total++;const ok=(d[L.id+"-"+x.li]||0)>=70;if(ok)done++;else if(!next&&i>=st)next=x}));return {total,done,next}}
function lessonsListHTML(i){const d=getDone();return `<ul class="list">${lessonsOf(i).map(x=>{const sc=d[x.L.id+"-"+x.li];return `<li class="row" style="align-items:center"><div class="txt"><b>الدرس ${x.li+1}: ${esc(x.g.t)}</b><div class="small muted">${x.words.length} كلمة · ${sc>=70?`<span class="ok">نجحت ${sc}%</span>`:sc!=null?`آخر نتيجة ${sc}%`:"لم يبدأ بعد"}</div></div><button class="btn" data-li="${x.li}">${sc>=70?"راجع":"ابدأ"}</button></li>`}).join("")}</ul>`}
let lq=null;
function shuffleA(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuiz(x){const pool=x.L.words;const qs=[];const gx=GEX[x.L.id+"-"+x.li]||[];
  shuffleA(gx).slice(0,5).forEach(g=>{const opts=shuffleA([g[1]].concat(g[2]));qs.push({q:`<span class="muted small" style="display:block">اختر الإجابة الصحيحة:</span>${bidiHTML(esc(g[0]))}`,opts,a:opts.indexOf(g[1]),e:g[3]})});
  shuffleA(x.words).slice(0,gx.length?3:5).forEach(w=>{const wrong=shuffleA(pool.filter(o=>o[2]!==w[2])).slice(0,3).map(o=>o[2]);const opts=shuffleA([w[2]].concat(wrong));qs.push({q:`ما معنى <i>${esc(full(w))}</i>؟`,opts,a:opts.indexOf(w[2]),say:full(w)})});
  shuffleA(x.words.filter(w=>["m","f","n"].includes(w[0]))).slice(0,gx.length?2:3).forEach(w=>{const opts=["der","die","das"];qs.push({q:`ما أداة كلمة <i>${esc(w[1])}</i> (${esc(w[2])})؟`,opts,a:opts.indexOf(ART[w[0]]),say:full(w)})});
  return {id:x.L.id+"-"+x.li,qs,ans:{},checked:false}}
function renderLesson(){
  const x=lessonsOf(view.lvl)[view.li];if(!x){go({name:"home"});return}
  if(!lq||lq.id!==x.L.id+"-"+x.li)lq=makeQuiz(x);
  const all=lessonsOf(view.lvl),nextX=all[view.li+1];
  const sc=lq.checked?Math.round(lq.qs.filter((q,i)=>lq.ans[i]===q.a).length/lq.qs.length*100):null;
  app.innerHTML=`<button class="back" id="back">→ ${esc(x.L.id)}</button>
  <p class="card-k" style="margin:0">${esc(x.L.id)} · الدرس ${x.li+1} من ${all.length}</p><h1>${esc(x.g.t)}</h1>
  <h2 style="margin-top:18px">فيديو الشرح</h2><div id="lv"></div>${videoBlock(x)}
  <h2 style="margin-top:22px">1. الشرح مكتوبًا</h2><div class="box gb" style="padding-top:4px">${x.g.b}</div>

  <h2 style="margin-top:22px">3. اختبار الدرس</h2><p class="muted small" style="margin-top:0">${lq.qs.length} أسئلة على قاعدة الدرس وكلماته وأدواتها. للنجاح تحتاج إلى 70%.</p>

let LV={slides:[],i:0,auto:false,token:0,key:""};
function ytq(t){const m=t.match(/[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß \/.-]*/g);return m?m.join(" ").trim():t}
function buildSlides(html){const d=document.createElement("div");d.innerHTML=html;const out=[];[...d.children].forEach(el=>{if(el.matches("ul,ol"))[...el.children].forEach(li=>out.push(`<p>${li.innerHTML}</p>`));else out.push(el.outerHTML)});return out.length?out:[html]}

function stopLV(){LV.auto=false;LV.token++;try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}}
function speakSeq(parts,done){
  const tok=++LV.token;let fired=false;const fin=()=>{if(fired||tok!==LV.token)return;fired=true;done&&done()};

  const deV=VOICES.find(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith("de")),arV=VOICES.find(v=>v.lang&&v.lang.toLowerCase().startsWith("ar"));
  const use=parts.filter(p=>p.de||arV);
  if(!use.length){setTimeout(fin,3500);return}
  use.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p.t);u.lang=p.de?"de-DE":"ar-SA";if(p.de&&deV)u.voice=deV;if(!p.de&&arV)u.voice=arV;u.rate=p.de?.85:1;if(k===use.length-1){u.onend=fin;u.onerror=fin}try{ss.speak(u)}catch(e){}});

}

  const ai=$("#ai");if(ai)ai.onclick=async()=>{
    aiBusy=true;aiErr="";drawResults();const term=sq;
    try{const j=await sample.json(`You are a German–Arabic learner's dictionary. The learner searched for: "${term}" (it may be Arabic or German). Find the best German word for it. Return ONLY JSON: {"found": true or false, "de": "German word (nouns singular, capitalized, WITHOUT article; verbs in infinitive)", "article": "der" or "die" or "das" or "" if not a noun, "ar": "short Arabic meaning", "pron": "German pronunciation written in Arabic letters", "level": "approx CEFR level like A1", "sentences": [{"de": "German sentence using the word", "ar": "Arabic translation"}] with exactly 4 natural sentences of increasing difficulty}`,{modelTier:"quick"});
      if(term===sq)aiRes=j}
    catch(e){aiErr=e&&e.code==="not_granted"?"يجب أن توافق على استخدام الذكاء الاصطناعي ليعمل هذا البحث.":"البحث مع المساعد الذكي غير متاح الآن، حاول بعد قليل."}
    aiBusy=false;if(view.name==="search"&&term===sq)drawResults();
  };
}

try{const th=localStorage.getItem("theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
{const p=parseHash(location.hash);if(location.hash)Object.assign(view,p);try{history.replaceState({y:0,n:0},"")}catch(e){}}
render();
if("speechSynthesis" in window){try{speechSynthesis.getVoices()}catch(e){}}
(async()=>{try{if(!(window.claude&&claude.use)&&typeof AI_ENDPOINT==="string"&&AI_ENDPOINT){sample=makeRemoteSample(AI_ENDPOINT);if(view.name==="search")drawResults();else if(view.name==="chat"||view.name==="photo")render();return}if(window.claude&&claude.use){sample=await claude.use("sample");if(sample&&view.name==="search")drawResults();else if(sample&&(view.name==="chat"||view.name==="photo"))render()}}catch(e){sample=null}})();
function loadExtra(){let n=0;const L=["topics","content","aliases"];L.forEach(f=>{const sc=document.createElement("script");sc.src="data/"+f+".js?v=45";sc.async=false;
  sc.onload=()=>{if(f==="aliases"){SIDX=null}if(++n===L.length&&(["topics","dialogs","mock","stats","search"].includes(view.name)||(view.name==="level"&&view.tab==="topics"))){const y=window.scrollY;render();window.scrollTo(0,y)}};
  sc.onerror=()=>setTimeout(()=>document.body.appendChild(sc.cloneNode()),3000);document.body.appendChild(sc)})}
function loadDict(){if(DICT.length)return;const sc=document.createElement("script");sc.src="data/dict.js?v=45";sc.async=true;
  sc.onload=()=>{if(!window.__DICT)return;DICT=window.__DICT;CARDIDX=null;SIDX=null;for(const k in LVW_CACHE)delete LVW_CACHE[k];addDictCorpus();
    if(["home","dict","search","cards","level","practice"].includes(view.name)){const y=window.scrollY;render();window.scrollTo(0,y)}};
  sc.onerror=()=>{setTimeout(loadDict,3000)};document.body.appendChild(sc)}
if(!DICT.length){if(document.readyState==="complete")setTimeout(loadDict,0);else window.addEventListener("load",()=>setTimeout(loadDict,0))}
accountInit();
if(!EXTRA_OK()){if(document.readyState==="complete")setTimeout(loadExtra,0);else window.addEventListener("load",()=>setTimeout(loadExtra,0))}
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>{const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{try{r.update()}catch(e){}}).catch(()=>{})})}
</script>
