.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.abc-grid button{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.abc-grid button.combo{font-size:16px;background:var(--surface-2)}
.abc-grid button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.vid-stage>*{animation:popIn .45s cubic-bezier(.2,.8,.2,1) both}.vid-stage>*:nth-child(2){animation-delay:.12s}.vid-stage>*:nth-child(3){animation-delay:.24s}@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}}
.lv-stage{align-items:stretch;justify-content:center;text-align:start;font-size:18px;line-height:1.9;min-height:240px}
.lv-slide{width:100%}
.lv-slide p{margin:0}
.lv-slide i{color:#FFCE00;font-family:var(--de);font-style:normal;cursor:pointer}
.lv-slide .tip{background:rgba(255,255,255,.08);color:#fff}
.lv-slide .tw{margin:0}
.lv-slide table{color:#fff}
.lv-slide th,.lv-slide td{border-color:rgba(255,255,255,.2)}
.lv-slide th{background:rgba(255,255,255,.08)}
.ytbox{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ytc{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);text-decoration:none;transition:transform .15s ease,border-color .15s ease}
.ytc:hover{border-color:var(--ink);transform:translateY(-2px)}
.ytc small{display:block;color:var(--muted);font-size:13px}
.ytp{flex:none;width:44px;height:32px;border-radius:9px;background:#DD0000;color:#fff;display:grid;place-items:center;font-size:14px}
.card.themes::before{background:var(--das)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface);transition:transform .18s ease,border-color .18s ease}
.theme-tile:hover{transform:translateY(-3px);border-color:var(--ink)}
.theme-tile .ti{font-size:34px;line-height:1.2}
.theme-tile b{font-size:16px}
.theme-tile small{color:var(--muted);font-size:13px}
/* ===== motion ===== */
@media (prefers-reduced-motion:no-preference){
  .flagbg::before{animation:blobA 24s ease-in-out infinite alternate}
  .flagbg::after{animation:blobB 30s ease-in-out infinite alternate}
  .flagbg{animation:inkMove 36s ease-in-out infinite alternate}
  @keyframes blobA{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-18vw,22vh) scale(1.15)}100%{transform:translate(-32vw,8vh) scale(.95)}}
  @keyframes blobB{0%{transform:translate(0,0) scale(1)}50%{transform:translate(20vw,-18vh) scale(1.1)}100%{transform:translate(8vw,-34vh) scale(1.2)}}
  @keyframes inkMove{0%{background-position:0 0}100%{background-position:40vw 20vh}}
  header.top::after{background-size:200% 100%;animation:none}
  #app.enter>*{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}
  #app.enter>*:nth-child(2){animation-delay:.06s}
  #app.enter>*:nth-child(3){animation-delay:.12s}
  #app.enter>*:nth-child(4){animation-delay:.18s}
  #app.enter>*:nth-child(5){animation-delay:.24s}
  #app.enter>*:nth-child(n+6){animation-delay:.3s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .path .step{animation:fadeUp .5s both}
  .path .step:nth-child(2){animation-delay:.05s}.path .step:nth-child(3){animation-delay:.1s}.path .step:nth-child(4){animation-delay:.15s}.path .step:nth-child(5){animation-delay:.2s}.path .step:nth-child(6){animation-delay:.25s}.path .step:nth-child(n+7){animation-delay:.3s}
  .card,.lvl,.btn,.chip,.ibtn,.say,.ditem,.result{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease}
  .card:hover,.lvl:hover,.result:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(0,0,0,.35)}
  .card:active,.lvl:active,.btn:active,.chip:active,.ibtn:active,.say:active{transform:scale(.97)}
  .bar-f{animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
  @keyframes grow{from{width:0}}
  .wave{display:inline-block;transform-origin:70% 70%;animation:wave 1.8s ease-in-out .6s 2}
  @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}}
  .step.tried .dot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,206,0,.45)}50%{box-shadow:0 0 0 8px rgba(255,206,0,0)}}
  .msg{animation:fadeUp .3s both}
  .card-go{transition:transform .2s ease}
  .card:hover .card-go{transform:translateX(-6px)}
}
@media (max-width:520px){.parts{grid-template-columns:repeat(2,1fr)}.lvlcode{font-size:44px}}
</style>

    <button class="ibtn" id="menuBtn" aria-label="القائمة" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="brand" id="home"><span class="flag" aria-hidden="true"><span style="background:#000"></span><span style="background:#DD0000"></span><span style="background:#FFCE00"></span></span>ألماني من الصفر</button>
    <button class="ibtn" id="chatBtn" aria-label="محادثة مع المساعد الذكي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg></button>
    <button class="ibtn" id="searchBtn" aria-label="ابحث عن كلمة" aria-expanded="false" aria-controls="sbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </div>

</div></header>

  <h2 id="lgT">تسجيل الدخول</h2>
  <p class="small muted">اكتب اسمك عشان تقدمك ونتايج امتحاناتك يتحفظوا باسمك. الحساب بيتحفظ على الجهاز ده.</p>

<noscript><p style="padding:20px;font-family:sans-serif">الموقع محتاج JavaScript يكون شغّال في المتصفح.</p></noscript>
<script src="config.js"></script>
<script src="data/levels.js"></script>

<script>

const ART={m:"der",f:"die",n:"das",p:"die"};
/* ===== Flashcards with spaced repetition ===== */
const SRS_IV=[0,1,3,7,16,35,90,180];
function today(){const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)}
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function srsAll(){return lsGet("srs",{})}
function srsCfg(){return Object.assign({lv:"A1",n:10,dir:"de",auto:true},lsGet("srs_cfg",{}))}
let CARDIDX=null;
function cardIdx(){if(!CARDIDX){CARDIDX={};DICT.forEach(D=>D.words.forEach(w=>{CARDIDX[D.id+":"+w[1]]=w}))}return CARDIDX}
function srsDueIds(){const S=srsAll(),t=today(),I=cardIdx();return Object.keys(S).filter(id=>I[id]&&S[id].d<=t).sort((a,b)=>S[a].d-S[b].d)}
function srsNewToday(){const x=lsGet("srs_day",{});return x.day===today()?x.n:0}
function srsNewLeft(){return Math.max(0,srsCfg().n-srsNewToday())}
function srsLvStats(id){const S=srsAll();const D=DICT.find(x=>x.id===id);let seen=0,ok=0;D.words.forEach(w=>{const c=S[id+":"+w[1]];if(c){seen++;if(c.b>=4)ok++}});return {total:D.words.length,seen,ok}}
function srsStreak(){const s=lsGet("srs_streak",{last:0,n:0});return s.last>=today()-1?s.n:0}
function srsBump(){const s=lsGet("srs_streak",{last:0,n:0}),t=today();if(s.last===t)return;s.n=s.last===t-1?s.n+1:1;s.last=t;lsSet("srs_streak",s)}
function ivTxt(d){return d<=0?"دلوقتي":d===1?"بكرة":d===2?"بعد يومين":d<11?`بعد ${d} أيام`:d<30?`بعد ${d} يوم`:d<60?"بعد شهر":`بعد ${Math.round(d/30)} شهور`}
function srsNext(c,g){const b=c?c.b:0;if(g===0)return {b:0,iv:0};if(g===1){const nb=Math.max(1,b);return {b:nb,iv:Math.max(1,Math.round(SRS_IV[nb]/2))}}const nb=Math.min(c?b+1:2,SRS_IV.length-1);return {b:nb,iv:SRS_IV[nb]}}
let sess=null;
function startSess(){const cfg=srsCfg(),S=srsAll(),I=cardIdx();
  const due=srsDueIds().slice(0,100);
  const D=DICT.find(x=>x.id===cfg.lv)||DICT[0];
  const fresh=shuffleA(D.words.filter(w=>!S[D.id+":"+w[1]])).slice(0,srsNewLeft()).map(w=>D.id+":"+w[1]);
  const q=[];let i=0,j=0;while(i<due.length||j<fresh.length){if(i<due.length)q.push(due[i++]);if(i<due.length)q.push(due[i++]);if(j<fresh.length)q.push(fresh[j++])}
  sess={q,i:0,flip:false,newSet:new Set(fresh),res:[0,0,0],total:q.length};
}
function gradeCard(g){const id=sess.q[sess.i],S=srsAll(),c=S[id];const nx=srsNext(c,g),t=today();
  if(!c&&sess.newSet.has(id)){const x=lsGet("srs_day",{});lsSet("srs_day",{day:t,n:(x.day===t?x.n:0)+1});sess.newSet.delete(id)}
  S[id]={b:nx.b,d:t+nx.iv,r:((c&&c.r)||0)+1,l:((c&&c.l)||0)+(g===0?1:0)};lsSet("srs",S);
  sess.res[g]++;
  if(g===0)sess.q.splice(Math.min(sess.i+4,sess.q.length),0,id);
  sess.i++;sess.flip=false;srsBump();renderCards();
}
function renderCards(){
  const cfg=srsCfg();
  if(sess&&sess.i<sess.q.length){
    const id=sess.q[sess.i],w=cardIdx()[id],S=srsAll(),c=S[id],lv=id.split(":")[0];
    const isNew=!c,front=cfg.dir==="de";
    const deSide=`<div style="font-family:var(--de);direction:ltr;font-size:30px;font-weight:700;line-height:1.3">${wHTML(w)}</div>`;
    const arSide=`<div style="font-size:26px;font-weight:700;line-height:1.4">${esc(w[2])}</div>`;
    const back=`${front?arSide:deSide}<p class="muted small" style="margin:6px 0 0">النطق: ${esc(w[3])}${w[6]?` · الجمع: <i>die ${esc(w[6])}</i>`:w[0]==="p"?" · جمع فقط":""}</p>${w[4]?`<div class="ex" style="margin-top:12px;font-size:16px"><i>${esc(w[4])}</i><br>${esc(w[5])}</div>`:""}`;
    const pg=Math.round(sess.i/sess.q.length*100);
    app.innerHTML=`<button class="back" id="back">→ بطاقات الحفظ</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0" class="small muted"><span>${sess.i+1} من ${sess.q.length}</span><span>${isNew?"🆕 كلمة جديدة":"🔁 مراجعة"} · ${esc(lv)}</span></div>
    <div style="height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px"><div style="height:100%;width:${pg}%;background:var(--das)"></div></div>
    <div class="box" id="fcard" style="min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;cursor:${sess.flip?"default":"pointer"};padding:26px 18px">
      ${front?deSide:arSide}
      <button class="say" data-say="${esc(full(w))}" aria-label="اسمع">${SPK}</button>
      ${sess.flip?`<hr style="width:100%;border:0;border-top:1px solid var(--line);margin:10px 0">${back}`:`<p class="muted small" style="margin-top:10px">${front?"تفتكر معناها إيه؟":"تفتكرها بالألماني إزاي؟"} فكّر وبعدين اقلب البطاقة</p>`}
    </div>
    ${sess.flip?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[["مكنتش عارفها","var(--die)",0],["صعبة","var(--gold)",1],["عرفتها","var(--das)",2]].map(([t,col,g])=>`<button class="btn" data-g="${g}" style="flex-direction:column;justify-content:center;border-color:${col};padding:10px 6px"><b style="color:${col}">${t}</b><small class="muted">${ivTxt(srsNext(c,g).iv)}</small></button>`).join("")}</div>`:`<div class="row-btns" style="justify-content:center"><button class="btn primary" id="flip" style="min-width:60%;justify-content:center">اقلب البطاقة</button></div>`}
    <div class="row-btns" style="justify-content:center"><button class="btn" id="endS" style="font-size:14px">إنهاء الجلسة</button></div>`;
    bindSay(app);
    const doFlip=()=>{if(sess.flip)return;sess.flip=true;renderCards();if(cfg.auto&&!front)speak(full(w))};
    $("#fcard").onclick=e=>{if(e.target.closest(".say"))return;doFlip()};
    const fl=$("#flip");if(fl)fl.onclick=doFlip;
    app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>gradeCard(+b.dataset.g));
    $("#back").onclick=$("#endS").onclick=()=>{sess=null;renderCards()};
    if(cfg.auto&&front&&!sess.flip)setTimeout(()=>speak(full(w)),250);
    return;
  }
  let summary="";
  if(sess){const r=sess.res;summary=`<div class="total"><span>خلّصت الجلسة 🎉 · عرفت <b>${r[2]}</b> · صعبة <b>${r[1]}</b> · مكنتش عارف <b>${r[0]}</b></span></div>`;sess=null}
  const due=srsDueIds().length,left=srsNewLeft(),D=DICT.find(x=>x.id===cfg.lv)||DICT[0],st=srsLvStats(D.id);
  const newAvail=Math.min(left,st.total-st.seen),tot=due+newAvail,streak=srsStreak();
  const tom=(()=>{const S=srsAll(),t=today()+1,I=cardIdx();return Object.keys(S).filter(id=>I[id]&&S[id].d===t).length})();
  app.innerHTML=`<h1>بطاقات الحفظ</h1><p class="lead">احفظ كلمات القاموس بالتكرار الذكي: الكلمة اللي بتغلط فيها بترجعلك بسرعة، واللي بتعرفها بتبعد عنك أكتر وأكتر لحد ما تثبت في دماغك. خمس دقايق كل يوم أحسن من ساعتين مرة في الأسبوع.</p>
  ${summary}
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
    <div class="box" style="text-align:center;margin:0;padding:12px 6px"><b style="font-size:24px;display:block">${due}</b><small class="muted">للمراجعة</small></div>
    <div class="box" style="text-align:center;margin:0;padding:12px 6px"><b style="font-size:24px;display:block">${newAvail}</b><small class="muted">جديدة النهارده</small></div>
    <div class="box" style="text-align:center;margin:0;padding:12px 6px"><b style="font-size:24px;display:block">${streak}🔥</b><small class="muted">أيام ورا بعض</small></div>
  </div>
  ${tot?`<div class="row-btns" style="margin-bottom:22px"><button class="btn primary" id="startS" style="flex:1;justify-content:center">ابدأ (${tot} بطاقة)</button></div>`:`<div class="box" style="text-align:center">✓ خلّصت كل بطاقات النهارده. ${tom?`بكرة عندك ${tom} بطاقة للمراجعة.`:"ارجع بكرة."}</div>`}
  <h2>الكلمات الجديدة من أنهي مستوى؟</h2>
  <div class="chips" role="group" aria-label="مستوى الكلمات الجديدة">${DICT.map(x=>{const s=srsLvStats(x.id);return `<button class="chip" data-cl="${x.id}" aria-pressed="${x.id===D.id}">${x.id} · ${s.seen}/${s.total}</button>`}).join("")}</div>
  <div class="box"><p style="margin:0 0 6px"><b>${D.id}</b>: شُفت ${st.seen} من ${st.total} كلمة، وثبّت ${st.ok}.</p><div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex"><div style="width:${st.ok/st.total*100}%;background:var(--das)"></div><div style="width:${(st.seen-st.ok)/st.total*100}%;background:var(--gold)"></div></div><p class="small muted" style="margin:6px 0 0">الأخضر: ثابتة · الأصفر: لسه بتتراجع</p></div>
  <h2>الإعدادات</h2>
  <p class="small muted" style="margin:0 0 6px">عدد الكلمات الجديدة في اليوم</p>
  <div class="chips">${[5,10,20,30].map(n=>`<button class="chip" data-cn="${n}" aria-pressed="${cfg.n===n}">${n}</button>`).join("")}</div>
  <p class="small muted" style="margin:0 0 6px">اتجاه البطاقة</p>
  <div class="chips"><button class="chip" data-cd="de" aria-pressed="${cfg.dir==="de"}">ألماني ← عربي</button><button class="chip" data-cd="ar" aria-pressed="${cfg.dir==="ar"}">عربي ← ألماني</button></div>
  <p class="small muted" style="margin:0 0 6px">النطق التلقائي</p>
  <div class="chips"><button class="chip" data-ca="1" aria-pressed="${cfg.auto}">شغّال</button><button class="chip" data-ca="0" aria-pressed="${!cfg.auto}">مقفول</button></div>
  <div class="row-btns" style="margin-top:20px"><button class="btn" id="resetS" style="font-size:14px">امسح تقدّم البطاقات</button></div>`;
  const setC=o=>{lsSet("srs_cfg",Object.assign(srsCfg(),o));renderCards()};
  app.querySelectorAll("[data-cl]").forEach(b=>b.onclick=()=>setC({lv:b.dataset.cl}));
  app.querySelectorAll("[data-cn]").forEach(b=>b.onclick=()=>setC({n:+b.dataset.cn}));
  app.querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>setC({dir:b.dataset.cd}));
  app.querySelectorAll("[data-ca]").forEach(b=>b.onclick=()=>setC({auto:b.dataset.ca==="1"}));
  const sb=$("#startS");if(sb)sb.onclick=()=>{startSess();renderCards();window.scrollTo(0,0)};
  $("#resetS").onclick=()=>{if(confirm("متأكد؟ كل تقدّمك في البطاقات هيتمسح.")){["srs","srs_day","srs_streak"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});renderCards()}};
}

let verbLv="all",verbQ="",verbTab="list",vq=null;

function mcq(L,P,k,ex,S){
  const st=S[k]||(S[k]={ans:{},checked:false,plays:0});
  const isL=k==="l",tts="speechSynthesis" in window;
  let top=isL?(tts?`<div class="box"><p style="margin-top:0">اسمع النص (تقدر تسمعه مرتين)، وبعدين جاوب.</p><div class="row-btns"><button class="btn primary" id="play" ${st.plays>=2&&!st.checked?"disabled":""}>${SPK} شغّل النص</button><span class="muted small">مرات الاستماع: ${st.plays} / 2</span></div>${st.checked?`<details style="margin-top:10px"><summary>اعرض النص</summary><p class="text-de">${esc(ex.text)}</p></details>`:""}</div>`
    :`<div class="box"><p class="muted" style="margin-top:0">جهازك مش بيدعم النطق الصوتي، فاقرأ النص بدل ما تسمعه:</p><p class="text-de">${esc(ex.text)}</p></div>`)
    :`<div class="box"><p class="muted small" style="margin-top:0">اقرأ النص وجاوب على الأسئلة.</p><p class="text-de">${esc(ex.text)}</p></div>`;
  P.innerHTML=top+ex.qs.map((q,qi)=>`<fieldset class="q" style="border:0;padding:0"><legend class="qt">${qi+1}. ${esc(q[0])}</legend>${q[1].map((o,oi)=>{let c="opt";if(st.checked){if(oi===q[2])c+=" right";else if(st.ans[qi]===oi)c+=" wrong"}return `<label class="${c}"><input type="radio" name="q${qi}" value="${oi}" ${st.ans[qi]===oi?"checked":""} ${st.checked?"disabled":""}>${esc(o)}</label>`}).join("")}</fieldset>`).join("")+
  `<div class="row-btns">${st.checked?`<button class="btn" id="retry">أعد الجزء ده</button>`:`<button class="btn primary" id="check">صحّح</button>`}</div><div class="err" id="err" role="alert"></div>`;
  P.querySelectorAll("input[type=radio]").forEach(i=>i.onchange=()=>{st.ans[+i.name.slice(1)]=+i.value;$("#err").textContent=""});
  const play=$("#play");if(play)play.onclick=()=>{if(st.plays<2||st.checked){if(!st.checked)st.plays++;speak(ex.text,.85);renderLevel()}};
  const ch=$("#check");if(ch)ch.onclick=()=>{
    if(Object.keys(st.ans).length<ex.qs.length){$("#err").textContent="جاوب على كل الأسئلة الأول.";return}
    const c=ex.qs.filter((q,i)=>st.ans[i]===q[2]).length;st.checked=true;setRes(L.id,k,Math.round(c/ex.qs.length*25));renderLevel()};
  const rt=$("#retry");if(rt)rt.onclick=()=>{S[k]={ans:{},checked:false,plays:0};renderLevel()};
}

async function grade(L,kind,task,answer,max){
  const prompt=`You are a strict but kind German examiner (Goethe-style) grading a learner at CEFR level ${L.id}. Task (${kind}): ${task}
Learner's answer:
"""${answer}"""
Grade it out of ${max} points considering task completion, grammar, vocabulary and coherence appropriate for ${L.id}. Write feedback in simple Egyptian Arabic (3-5 short sentences: what is good, main mistakes with the correct German form). Also give a corrected version of the learner's German text.
Return ONLY JSON: {"score": integer 0-${max}, "feedback": "Arabic text", "corrected": "corrected German text"}`;
  const j=await sample.json(prompt,{modelTier:"default"});
  return {score:Math.max(0,Math.min(max,Math.round(+j.score||0))),feedback:String(j.feedback||""),corrected:String(j.corrected||"")};
}
function fallbackScore(text,min){const n=wc(text);return Math.min(25,Math.round(20*Math.min(1,n/min))+(n>=min?5:0))}
function feedbackHTML(st,model){
  if(!st.result)return "";const r=st.result;
  return `<div class="feedback"><p style="margin-top:0"><b>الدرجة: ${r.score} / 25</b></p>${r.feedback?`<p>${esc(r.feedback)}</p>`:""}${r.corrected?`<p class="small muted">النسخة المصححة:</p><p class="text-de">${esc(r.corrected)}</p>`:""}${r.ai?"":`<p class="small muted">التصحيح الذكي مش متاح هنا، فالدرجة تقدير تقريبي حسب طول الإجابة. قارن إجابتك بالنموذج:</p>`}${model?`<details><summary>إجابة نموذجية</summary><p class="text-de">${esc(model)}</p></details>`:""}</div>`;
}
function writing(L,P,ex,S){
  const st=S.w||(S.w={text:"",busy:false,result:null});
  P.innerHTML=`<div class="box"><p style="margin-top:0"><b>المطلوب:</b> ${esc(ex.task)}</p><p class="muted small" style="margin:0">اكتب بالألماني، ${ex.min} كلمة على الأقل.</p></div>
  <label for="wt" class="small muted">إجابتك</label><textarea id="wt" lang="de" spellcheck="false" ${st.busy?"disabled":""}>${esc(st.text)}</textarea>
  <div class="row-btns"><button class="btn primary" id="wgo" ${st.busy?"disabled":""}>${st.busy?"بيتم التصحيح…":"صحّح الكتابة"}</button><span class="muted small" id="wcnt">${wc(st.text)} كلمة</span></div>
  <div class="err" id="err" role="alert"></div>${feedbackHTML(st,ex.model)}`;
  const ta=$("#wt");ta.oninput=()=>{st.text=ta.value;$("#wcnt").textContent=wc(ta.value)+" كلمة";$("#err").textContent=""};
  $("#wgo").onclick=async()=>{
    if(wc(st.text)<5){$("#err").textContent="اكتب إجابتك الأول (5 كلمات على الأقل).";return}
    st.busy=true;st.result=null;renderLevel();
    try{if(!sample)throw 0;const g=await grade(L,"Schreiben",ex.task+` (min. ${ex.min} words)`,st.text,25);st.result={...g,ai:true}}
    catch(e){st.result={score:fallbackScore(st.text,ex.min),ai:false}}
    st.busy=false;setRes(L.id,"w",st.result.score);if(view.name==="level"&&view.part==="w")renderLevel();
  };
}
function stopRec(){if(rec){try{rec.stop()}catch(e){}rec=null}}
function speaking(L,P,ex,S){
  const st=S.s||(S.s={ans:ex.qs.map(()=>""),busy:false,result:null,recIdx:-1});
  P.innerHTML=`<div class="box"><p style="margin:0">الممتحن هيسألك 4 أسئلة. اسمع السؤال وجاوب بصوتك${SR?"":" (لو المايك مش شغال اكتب إجابتك)"}. حاول تتكلم بجمل كاملة.</p></div>`+
  ex.qs.map((q,i)=>`<div class="box"><div class="row-btns" style="margin-top:0;justify-content:space-between"><span class="text-de" style="font-weight:500">${i+1}. ${esc(q)}</span><button class="say" data-say="${esc(q)}" aria-label="اسمع السؤال">${SPK}</button></div>
  <textarea class="short" id="sa${i}" lang="de" placeholder="${SR?"دوس سجّل واتكلم، أو اكتب هنا":"اكتب إجابتك هنا"}" ${st.busy?"disabled":""}>${esc(st.ans[i])}</textarea>
  ${SR?`<div class="row-btns"><button class="btn rec" data-r="${i}" aria-pressed="${st.recIdx===i}" ${st.busy?"disabled":""}>${st.recIdx===i?"إيقاف التسجيل":"سجّل إجابتك"}</button></div>`:""}</div>`).join("")+
  `<div class="row-btns"><button class="btn primary" id="sgo" ${st.busy?"disabled":""}>${st.busy?"بيتم التقييم…":"قيّم المحادثة"}</button></div><div class="err" id="err" role="alert"></div>${feedbackHTML(st,"")}`;
  bindSay(P);
  ex.qs.forEach((q,i)=>{const ta=$("#sa"+i);ta.oninput=()=>{st.ans[i]=ta.value;$("#err").textContent=""}});
  P.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.r;
    if(st.recIdx===i){stopRec();st.recIdx=-1;renderLevel();return}
    stopRec();
    try{
      const r=new SR();r.lang="de-DE";r.interimResults=false;r.continuous=true;
      const base=st.ans[i]?st.ans[i]+" ":"";let got="";
      r.onresult=e=>{got="";for(let k=0;k<e.results.length;k++)got+=e.results[k][0].transcript+" ";st.ans[i]=(base+got).trim();const ta=$("#sa"+i);if(ta)ta.value=st.ans[i]};
      r.onerror=e=>{st.recIdx=-1;rec=null;renderLevel();const er=$("#err");if(er)er.textContent=e.error==="not-allowed"?"المايك مش مسموح هنا، اكتب إجابتك بدل الكلام.":"التسجيل وقف، جرّب تاني أو اكتب إجابتك."};
      r.onend=()=>{if(st.recIdx===i){st.recIdx=-1;rec=null;renderLevel()}};
      r.start();rec=r;st.recIdx=i;renderLevel();
    }catch(e){$("#err").textContent="التسجيل الصوتي مش شغال على الجهاز ده، اكتب إجابتك."}
  });
  $("#sgo").onclick=async()=>{
    stopRec();st.recIdx=-1;
    const empty=st.ans.findIndex(a=>wc(a)<2);
    if(empty>-1){$("#err").textContent=`جاوب على السؤال رقم ${empty+1} الأول.`;return}
    st.busy=true;st.result=null;renderLevel();
    const transcript=ex.qs.map((q,i)=>`Q${i+1}: ${q}\nA${i+1}: ${st.ans[i]}`).join("\n");
    try{if(!sample)throw 0;const g=await grade(L,"Sprechen (spoken answers, transcribed by speech recognition — ignore punctuation and capitalization)","Answer the examiner's questions in full sentences.",transcript,25);st.result={...g,ai:true}}
    catch(e){st.result={score:fallbackScore(st.ans.join(" "),ex.qs.length*12),ai:false}}
    st.busy=false;setRes(L.id,"s",st.result.score);if(view.name==="level"&&view.part==="s")renderLevel();
  };
}

/* ===== Lessons, daily plan, lesson quiz ===== */

function isDe(o){return !/[\u0600-\u06FF]/.test(o)&&/[A-Za-zÄÖÜäöüß]/.test(o)}
function lessonsOf(i){const L=LEVELS[i],n=L.grammar.length,per=Math.ceil(L.words.length/n);return L.grammar.map((g,li)=>({L,lvl:i,li,g,words:L.words.slice(li*per,(li+1)*per)}))}
function getDone(){try{return JSON.parse(localStorage.getItem("lessons_done")||"{}")}catch(e){return {}}}
function setDone(id,score){const d=getDone();d[id]=Math.max(score,d[id]||0);try{localStorage.setItem("lessons_done",JSON.stringify(d))}catch(e){}}
function planInfo(){const d=getDone();let total=0,done=0,next=null;LEVELS.forEach((L,i)=>lessonsOf(i).forEach(x=>{total++;const ok=(d[L.id+"-"+x.li]||0)>=70;if(ok)done++;else if(!next)next=x}));return {total,done,next}}
function lessonsListHTML(i){const d=getDone();return `<ul class="list">${lessonsOf(i).map(x=>{const sc=d[x.L.id+"-"+x.li];return `<li class="row" style="align-items:center"><div class="txt"><b>الدرس ${x.li+1}: ${esc(x.g.t)}</b><div class="small muted">${x.words.length} كلمة · ${sc>=70?`<span class="ok">نجحت ${sc}%</span>`:sc!=null?`آخر نتيجة ${sc}%`:"لسه"}</div></div><button class="btn" data-li="${x.li}">${sc>=70?"راجع":"ابدأ"}</button></li>`}).join("")}</ul>`}
let lq=null;
function shuffleA(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuiz(x){const pool=x.L.words;const qs=[];const gx=GEX[x.L.id+"-"+x.li]||[];
  shuffleA(gx).slice(0,5).forEach(g=>{const opts=shuffleA([g[1]].concat(g[2]));qs.push({q:`<span class="muted small">اختار الإجابة الصح:</span><br><span dir="auto" style="display:inline-block;font-family:var(--de),var(--ar)">${esc(g[0])}</span>`,opts,a:opts.indexOf(g[1]),e:g[3]})});
  shuffleA(x.words).slice(0,gx.length?3:5).forEach(w=>{const wrong=shuffleA(pool.filter(o=>o[2]!==w[2])).slice(0,3).map(o=>o[2]);const opts=shuffleA([w[2]].concat(wrong));qs.push({q:`يعني إيه <i>${esc(full(w))}</i>؟`,opts,a:opts.indexOf(w[2]),say:full(w)})});
  shuffleA(x.words.filter(w=>["m","f","n"].includes(w[0]))).slice(0,gx.length?2:3).forEach(w=>{const opts=["der","die","das"];qs.push({q:`إيه أداة كلمة <i>${esc(w[1])}</i> (${esc(w[2])})؟`,opts,a:opts.indexOf(ART[w[0]]),say:full(w)})});
  return {id:x.L.id+"-"+x.li,qs,ans:{},checked:false}}
function renderLesson(){
  const x=lessonsOf(view.lvl)[view.li];if(!x){go({name:"home"});return}
  if(!lq||lq.id!==x.L.id+"-"+x.li)lq=makeQuiz(x);
  const all=lessonsOf(view.lvl),nextX=all[view.li+1];
  const sc=lq.checked?Math.round(lq.qs.filter((q,i)=>lq.ans[i]===q.a).length/lq.qs.length*100):null;
  app.innerHTML=`<button class="back" id="back">→ ${esc(x.L.id)}</button>
  <p class="card-k" style="margin:0">${esc(x.L.id)} · الدرس ${x.li+1} من ${all.length}</p><h1>${esc(x.g.t)}</h1>
  <h2 style="margin-top:18px">🎬 فيديو الشرح</h2><div id="lv"></div>${videoBlock(x)}
  <h2 style="margin-top:22px">1. الشرح مكتوب</h2><div class="box gb" style="padding-top:4px">${x.g.b}</div>
  <h2>2. كلمات الدرس</h2><ul class="list">${x.words.map(w=>wordRow(w)).join("")}</ul>
  <h2 style="margin-top:22px">3. امتحان الدرس</h2><p class="muted small" style="margin-top:0">${lq.qs.length} أسئلة على قاعدة الدرس وكلماته وأدواتها. علشان تنجح محتاج 70%.</p>
  ${lq.qs.map((q,qi)=>`<fieldset class="q" style="border:0;padding:0"><legend class="qt" style="direction:rtl;text-align:right;font-family:var(--ar)">${qi+1}. ${q.q}</legend>${q.opts.map((o,oi)=>{let c="opt";if(lq.checked){if(oi===q.a)c+=" right";else if(lq.ans[qi]===oi)c+=" wrong"}return `<label class="${c}" style="direction:${isDe(o)?"ltr":"rtl"};font-family:${isDe(o)?"var(--de)":"var(--ar)"}"><input type="radio" name="lq${qi}" value="${oi}" ${lq.ans[qi]===oi?"checked":""} ${lq.checked?"disabled":""}>${esc(o)}</label>`}).join("")}${lq.checked&&q.e?`<p class="small" style="margin:4px 0 14px;color:${lq.ans[qi]===q.a?"var(--muted)":"var(--die)"}">💡 ${esc(q.e)}</p>`:""}</fieldset>`).join("")}
  <div class="err" id="err" role="alert"></div>
  ${lq.checked?`<div class="total"><span>نتيجتك: <b>${sc}%</b></span>${sc>=70?`<span class="ok">نجحت في الدرس ✓</span>`:`<span class="bad">راجع الشرح والكلمات وحاول تاني</span>`}</div><div class="row-btns"><button class="btn" id="retry">امتحان جديد</button>${sc>=70&&nextX?`<button class="btn primary" id="nextL">الدرس الجاي ←</button>`:""}${sc>=70&&!nextX?`<button class="btn primary" id="toExam">امتحان المستوى ←</button>`:""}</div>`:`<div class="row-btns"><button class="btn primary" id="chk">صحّح الامتحان</button></div>`}`;
  bindSay(app);app.querySelectorAll(".gb i").forEach(e=>e.onclick=()=>speak(e.textContent));
  if(LV.key!==lq.id){stopLV();LV={slides:buildSlides(x.g.b),i:0,auto:false,token:LV.token+1,key:lq.id}}drawLV();
  $("#back").onclick=()=>go({name:"level",lvl:view.lvl,tab:"lessons",part:"r"});
  app.querySelectorAll("input[type=radio]").forEach(r=>r.onchange=()=>{lq.ans[+r.name.slice(2)]=+r.value;$("#err").textContent=""});
  const chk=$("#chk");if(chk)chk.onclick=()=>{if(Object.keys(lq.ans).length<lq.qs.length){$("#err").textContent="جاوب على كل الأسئلة الأول.";return}lq.checked=true;const s2=Math.round(lq.qs.filter((q,i)=>lq.ans[i]===q.a).length/lq.qs.length*100);setDone(lq.id,s2);renderLesson()};
  const rt=$("#retry");if(rt)rt.onclick=()=>{lq=makeQuiz(x);renderLesson()};
  const nx=$("#nextL");if(nx)nx.onclick=()=>go({name:"lesson",lvl:view.lvl,li:view.li+1});
  const te=$("#toExam");if(te)te.onclick=()=>go({name:"level",lvl:view.lvl,tab:"exam",part:"r"});
}

/* ===== AI chat ===== */
let chat={mode:"talk",turns:{talk:[],ask:[]},busy:false,err:""},chatCtl=null;
function curLevel(){const n=planInfo().next;return n?n.L.id:"B2.2"}
function chatRules(mode){return mode==="talk"
 ?`You are a friendly German conversation partner for an Egyptian Arabic speaker who is learning German at CEFR level ${curLevel()}. Talk with them in simple German suited to that level: 1 to 3 short sentences, then one follow-up question to keep the conversation going. If their last message has mistakes, start your reply with one line beginning with "✏️" that gives the corrected German sentence and a very short explanation in Egyptian Arabic. If they write in Arabic, answer in simple German and add the Arabic meaning in brackets. Never write long paragraphs. If this is the very start, greet them and suggest a simple topic.`
 :`You are a patient German teacher for Arabic speakers. Answer the learner's questions about German (grammar, vocabulary, articles, pronunciation, exams, life in Germany) in simple Egyptian Arabic, always with short German example sentences. Keep answers under about 150 words. The learner is at level ${curLevel()}.`}
function renderChat(){
  const T=chat.turns[chat.mode];
  const intro=chat.mode==="talk"?"اكتب أي حاجة بالألماني (أو بالعربي)، والمساعد هيرد عليك على قد مستواك ويصلّحلك الغلط.":"اسأل أي سؤال عن الألماني: قاعدة، كلمة، نطق، امتحان، أو الحياة في ألمانيا.";
  app.innerHTML=`<h1>المساعد الذكي</h1>
  <div class="chips" role="group" aria-label="نوع المحادثة"><button class="chip" data-cm="talk" aria-pressed="${chat.mode==="talk"}">اتكلم ألماني</button><button class="chip" data-cm="ask" aria-pressed="${chat.mode==="ask"}">اسأل سؤال</button></div>
  <p class="lead" style="margin-bottom:12px">${intro}</p>
  <div class="msgs" id="msgs" aria-live="polite">${T.length?T.map((m,i)=>bubble(m,i)).join(""):`<div class="empty">ابدأ المحادثة ✍️</div>`}${chat.busy&&T.length&&T[T.length-1].role==="user"?`<div class="msg bot" id="live"><span class="muted">بيكتب…</span></div>`:""}</div>
  <div class="err" id="cerr" role="alert">${esc(chat.err)}</div>
  <div class="composer"><textarea id="cin" rows="2" placeholder="${chat.mode==="talk"?"Hallo! Wie geht's?":"مثلًا: إمتى أستخدم dem؟"}" aria-label="رسالتك" ${chat.busy?"disabled":""}></textarea>
  <div class="row-btns" style="margin-top:8px">${SR?`<button class="btn rec" id="cmic" aria-pressed="false">🎤 اتكلم</button>`:""}<button class="btn primary" id="csend" ${chat.busy?"disabled":""}>${chat.busy?"بيرد…":"ابعت"}</button>${T.length?`<button class="btn" id="cclear">محادثة جديدة</button>`:""}</div></div>
  ${sample?"":`<p class="small muted">المساعد الذكي لسه مش متفعّل على الموقع. هيتفعّل قريب إن شاء الله.</p>`}`;
  app.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{if(chat.busy)return;chat.mode=b.dataset.cm;chat.err="";renderChat()});
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const cin=$("#cin");cin.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat()}};
  $("#csend").onclick=sendChat;
  const cl=$("#cclear");if(cl)cl.onclick=()=>{if(chatCtl)chatCtl.abort();chat.turns[chat.mode]=[];chat.busy=false;chat.err="";renderChat()};
  const mic=$("#cmic");if(mic)mic.onclick=()=>{
    if(rec){stopRec();mic.setAttribute("aria-pressed","false");mic.textContent="🎤 اتكلم";return}
    try{const r=new SR();r.lang=chat.mode==="talk"?"de-DE":"ar-EG";r.interimResults=false;
      r.onresult=e=>{cin.value=(cin.value+" "+e.results[0][0].transcript).trim()};
      r.onend=()=>{rec=null;mic.setAttribute("aria-pressed","false");mic.textContent="🎤 اتكلم"};
      r.onerror=()=>{$("#cerr").textContent="المايك مش شغال هنا، اكتب رسالتك."};
      r.start();rec=r;mic.setAttribute("aria-pressed","true");mic.textContent="⏹ إيقاف"}catch(e){$("#cerr").textContent="المايك مش شغال هنا، اكتب رسالتك."}};
  const box=$("#msgs");box.scrollTop=box.scrollHeight;
}
function bubble(m,i){if(m.role==="user")return `<div class="msg me">${esc(m.content)}</div>`;
  return `<div class="msg bot"><div>${esc(m.content).replace(/\n/g,"<br>")}</div>${chat.mode==="talk"?`<button class="say" style="width:32px;height:32px;margin-top:6px" data-say="${esc(m.content.replace(/✏️.*\n?/,""))}" aria-label="اسمع الرد">${SPK}</button>`:""}</div>`}
async function sendChat(){
  const cin=$("#cin");const t=cin.value.trim();
  if(!t){$("#cerr").textContent="اكتب رسالة الأول.";return}
  if(!sample){$("#cerr").textContent="المساعد الذكي لسه مش متفعّل على الموقع.";return}
  const mode=chat.mode,T=chat.turns[mode];stopRec();
  T.push({role:"user",content:t});chat.busy=true;chat.err="";renderChat();
  chatCtl=new AbortController();
  const hist=T.slice(-16);
  try{
    const r=await sample([{role:"user",content:chatRules(mode)}].concat(hist),{cache:false,modelTier:"quick",signal:chatCtl.signal,onText:({text})=>{const l=$("#live");if(l&&chat.mode===mode)l.innerHTML=esc(text).replace(/\n/g,"<br>")}});
    T.push({role:"assistant",content:r.text||"…"});
  }catch(e){if(e&&e.code==="cancelled")return;chat.err=e&&e.code==="not_granted"?"لازم توافق على استخدام الذكاء الاصطناعي عشان المحادثة تشتغل.":e&&e.code==="rate_limited"?"استنى شوية وجرّب تاني.":"حصلت مشكلة، جرّب تاني."}
  chat.busy=false;if(view.name==="chat")renderChat();
}

function renderPhoto(){

  $("#pin").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!/^image\//.test(f.type)){photo.err="اختار صورة بس.";renderPhoto();return}if(photo.url)URL.revokeObjectURL(photo.url);photo={file:f,url:URL.createObjectURL(f),busy:false,res:null,err:""};renderPhoto()};

function photoResult(r){
  if(r.found===false)return `<div class="box">مش لاقي كلام ألماني واضح في الصورة. جرّب صورة أوضح.</div>`;
  const ws=(r.words||[]).map(w=>[w.article==="der"?"m":w.article==="die"?"f":w.article==="das"?"n":"",w.de||"",w.ar||"",w.pron||"","",""]);
  return `<h2>النص الألماني</h2><div class="box"><p class="text-de" style="margin:0">${esc(r.german||"")}</p><div class="row-btns"><button class="say" data-say="${esc(r.german||"")}" aria-label="اسمع النص">${SPK}</button></div></div>
  <h2>الترجمة</h2><div class="box"><p style="margin:0">${esc(r.arabic||"")}</p></div>
  ${ws.length?`<h2>كلمات مهمة</h2><ul class="list">${ws.map(w=>wordRow(w)).join("")}</ul>`:""}`}
async function translatePhoto(){
  if(!sample){photo.err="الترجمة من الصور لسه مش متفعّلة على الموقع.";renderPhoto();return}
  try{const lim=await sample.limits();if(!lim||!lim.images){photo.err="إرسال الصور مش متاح هنا.";renderPhoto();return}if(photo.file.size>lim.images.maxInputBytes){photo.err="الصورة كبيرة أوي، اختار صورة أصغر.";renderPhoto();return}}catch(e){}
  photo.busy=true;photo.err="";photo.res=null;renderPhoto();
  try{
    photo.res=await sample.json(`Read the German text in this image (sign, menu, letter, document or book page). Translate it for an Egyptian Arabic speaker learning German. Reply with ONLY JSON: {"found": true or false, "german": "the German text as read (keep line breaks short, max 600 characters)", "arabic": "natural Arabic translation (Egyptian-friendly, clear)", "words": [up to 8 important nouns/verbs from the text as {"de": "word (nouns singular without article, verbs infinitive)", "article": "der" or "die" or "das" or "", "ar": "short Arabic meaning", "pron": "pronunciation in Arabic letters"}]}. If there is no German text, return {"found": false}.`,{images:photo.file,modelTier:"default"});
  }catch(e){photo.err=e&&e.code==="not_granted"?"لازم توافق على استخدام الذكاء الاصطناعي عشان الترجمة تشتغل.":e&&e.code==="images_unavailable"?"إرسال الصور مش متاح هنا.":"حصلت مشكلة في الترجمة، جرّب تاني."}
  photo.busy=false;if(view.name==="photo")renderPhoto();
}

 m:{name:"der",g:"مذكر",rules:["أيام الأسبوع والشهور والفصول: <i>der Montag, der Mai, der Sommer</i>","الاتجاهات والطقس: <i>der Norden, der Regen, der Wind</i>","الأشخاص الذكور والمهن للمذكر: <i>der Vater, der Lehrer</i>","كلمات بتخلص بـ <i>-ling, -ismus, -ent, -ist, -or, -ig</i>: <i>der Frühling, der Student, der Motor</i>","كتير من الكلمات اللي بتخلص بـ <i>-er</i> للأشخاص والأدوات: <i>der Computer, der Fahrer</i>"]},

let LV={slides:[],i:0,auto:false,token:0,key:""};
function ytq(t){const m=t.match(/[A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß \/.-]*/g);return m?m.join(" ").trim():t}
function buildSlides(html){const d=document.createElement("div");d.innerHTML=html;const out=[];[...d.children].forEach(el=>{if(el.matches("ul,ol"))[...el.children].forEach(li=>out.push(`<p>${li.innerHTML}</p>`));else out.push(el.outerHTML)});return out.length?out:[html]}
function partsOf(html){const d=document.createElement("div");d.innerHTML=html;const parts=[];const walk=n=>n.childNodes.forEach(c=>{if(c.nodeType===3){const t=c.textContent.replace(/[—–→←]/g," ").trim();if(t&&/[\u0600-\u06FFA-Za-z0-9]/.test(t))parts.push({t,de:!/[\u0600-\u06FF]/.test(t)})}else if(c.nodeName==="I")parts.push({t:c.textContent,de:true});else if(c.nodeType===1)walk(c)});walk(d);const m=[];parts.forEach(p=>{const l=m[m.length-1];if(l&&l.de===p.de)l.t+=" , "+p.t;else m.push({...p})});return m}
function stopLV(){LV.auto=false;LV.token++;try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}}
function speakSeq(parts,done){
  const tok=++LV.token;let fired=false;const fin=()=>{if(fired||tok!==LV.token)return;fired=true;done&&done()};
  if(!("speechSynthesis" in window)){setTimeout(fin,3500);return}
  const ss=speechSynthesis;try{ss.cancel()}catch(e){}if(!VOICES.length)loadVoices();
  const deV=VOICES.find(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith("de")),arV=VOICES.find(v=>v.lang&&v.lang.toLowerCase().startsWith("ar"));
  const use=parts.filter(p=>p.de||arV);
  if(!use.length){setTimeout(fin,3500);return}
  use.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p.t);u.lang=p.de?"de-DE":"ar-SA";if(p.de&&deV)u.voice=deV;if(!p.de&&arV)u.voice=arV;u.rate=p.de?.85:1;if(k===use.length-1){u.onend=fin;u.onerror=fin}try{ss.speak(u)}catch(e){}});
  setTimeout(fin,use.reduce((a,p)=>a+p.t.length,0)*95+2000);
}
function narrate(){drawLV();speakSeq(partsOf(LV.slides[LV.i]),()=>{if(!LV.auto)return;if(LV.i<LV.slides.length-1)setTimeout(()=>{if(!LV.auto)return;LV.i++;narrate()},700);else{LV.auto=false;drawLV()}})}
function drawLV(){const box=$("#lv");if(!box)return;const n=LV.slides.length;
  const arV=VOICES.some(v=>v.lang&&v.lang.toLowerCase().startsWith("ar"));
  box.innerHTML=`<div class="vid"><div class="vid-stage lv-stage" key="${LV.i}"><div class="lv-slide">${LV.slides[LV.i]||""}</div></div><div class="vid-bar"><span style="width:${(LV.i+1)/n*100}%"></span></div><div class="vid-ctrl"><button class="ibtn" id="lvPrev" aria-label="السابق">⏭</button><button class="ibtn vid-play" id="lvPlay" aria-label="${LV.auto?"إيقاف":"تشغيل"}">${LV.auto?"⏸":"▶"}</button><button class="ibtn" id="lvNext" aria-label="التالي">⏮</button><button class="ibtn" id="lvSay" aria-label="اسمع تاني">🔊</button><span class="small" style="color:#fff;opacity:.8">${LV.i+1} / ${n}</span></div></div>${arV?"":`<p class="small muted" style="margin:6px 0 0">موبايلك مفيهوش صوت عربي، فالشرح العربي هيظهر مكتوب والأمثلة الألماني هتتقال بالصوت.</p>`}`;
  $("#lvPlay").onclick=()=>{if(LV.auto){stopLV();drawLV();return}LV.auto=true;narrate()};
  $("#lvPrev").onclick=()=>{stopLV();LV.i=Math.max(0,LV.i-1);drawLV();speakSeq(partsOf(LV.slides[LV.i]))};
  $("#lvNext").onclick=()=>{stopLV();LV.i=Math.min(n-1,LV.i+1);drawLV();speakSeq(partsOf(LV.slides[LV.i]))};
  $("#lvSay").onclick=()=>{LV.auto=false;speakSeq(partsOf(LV.slides[LV.i]))};
  box.querySelectorAll(".lv-slide i").forEach(e=>e.onclick=()=>speak(e.textContent));
}

  const card=(v,tag)=>`<a class="ytc" href="${v.u}" target="_blank" rel="noopener"><span class="ytp" aria-hidden="true">▶</span><span><b>${esc(v.t)}</b><small>${tag} · فراس أبو وهدان (Deutsch lernen mit Feras)</small></span></a>`;

/* ===== Topic dictionary ===== */
function renderThemes(){
  app.innerHTML=`<button class="back" id="back">→ الرئيسية</button><h1>كلمات حسب الموضوع</h1><p class="lead">كل الكلمات اللي ممكن تحتاجها في مكان معيّن، متجمعة مع بعض بأداتها ونطقها.</p>
  <div class="theme-grid">${THEMES.map(t=>`<button class="theme-tile" data-th="${t.id}"><span class="ti">${t.icon}</span><b>${esc(t.name)}</b><small>${t.words.length} كلمة</small></button>`).join("")}</div>
  <p class="muted small" style="margin-top:16px">المواضيع دي بتزيد على دفعات.</p>`;
  $("#back").onclick=()=>go({name:"home"});
  app.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>go({name:"theme",th:b.dataset.th}));
}
let thQ="";
function renderTheme(){
  const t=THEMES.find(x=>x.id===view.th)||THEMES[0];const nq=norm(thQ);
  const list=t.words.filter(w=>!nq||norm(w[1]).includes(nq)||norm(w[2]).includes(nq));
  const groups=[["m","der"],["f","die"],["n","das"],["p","جمع فقط"],["","أفعال وصفات"]];
  app.innerHTML=`<button class="back" id="back">→ كل المواضيع</button><div class="art-head"><span class="art-big" style="background:var(--surface-2);font-size:46px">${t.icon}</span><div><h1 style="margin:0">${esc(t.name)}</h1><p class="muted" style="margin:0">${t.words.length} كلمة</p></div></div>
  <div class="chips" style="margin-top:14px">${THEMES.map(x=>`<button class="chip" data-th2="${x.id}" aria-pressed="${x.id===t.id}">${x.icon} ${esc(x.name)}</button>`).join("")}</div>
  <div class="field" style="margin-bottom:12px"><input id="tq" type="search" placeholder="فلتر كلمات ${esc(t.name)}" value="${esc(thQ)}" aria-label="فلتر الكلمات"></div>
  ${groups.map(([g,n])=>{const ws=list.filter(w=>w[0]===g);return ws.length?`<h3><span class="${g&&g!=="p"?"art "+g:""}">${n}</span> <span class="muted small">· ${ws.length}</span></h3><ul class="list">${ws.map(w=>wordRow(w)).join("")}</ul>`:""}).join("")||`<div class="empty">مفيش كلمات بالبحث ده.</div>`}`;
  $("#back").onclick=()=>go({name:"themes"});
  app.querySelectorAll("[data-th2]").forEach(b=>b.onclick=()=>{thQ="";view.th=b.dataset.th2;renderTheme();syncHash();window.scrollTo(0,0)});
  const tq=$("#tq");tq.oninput=()=>{thQ=tq.value;const p=tq.selectionStart;renderTheme();const n=$("#tq");n.focus();try{n.setSelectionRange(p,p)}catch(e){}};
  bindSay(app);
}

const CORPUS=[];
LEVELS.forEach(L=>{L.words.forEach(w=>{if(w[4])CORPUS.push({de:w[4],ar:w[5],lv:L.id})});["r","l"].forEach(k=>L.exam[k].text.split(/(?<=[.!?])\s+|\s—\s/).forEach(s=>{if(s.trim().length>8)CORPUS.push({de:s.trim(),ar:"",lv:L.id})}))});
SENTS.forEach(c=>c.s.forEach(x=>CORPUS.push({de:x[0],ar:x[1],lv:""})));
DICT.forEach(D=>D.words.forEach(w=>{if(w[4])CORPUS.push({de:w[4],ar:w[5],lv:D.id})}));
THEMES.forEach(t=>t.words.forEach(w=>{if(w[4])CORPUS.push({de:w[4],ar:w[5],lv:""})}));
function stemOf(w){let t=w[1].split(" ").filter(x=>!["sich","um","an","auf","von","mit","über","für"].includes(x)).pop()||w[1];if(!w[0]&&t.length>5&&/en$/.test(t))t=t.slice(0,-2);else if(!w[0]&&t.length>5&&/n$/.test(t))t=t.slice(0,-1);return t}
function sentencesFor(w){const st=stemOf(w).toLowerCase();const re=new RegExp("(^|[^a-zäöüß])"+st.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");const seen=new Set();return CORPUS.filter(s=>{if(seen.has(s.de)||!re.test(s.de))return false;seen.add(s.de);return true}).slice(0,5)}
let sq="",aiRes=null,aiBusy=false,aiErr="";
function renderSearch(){
  if(sbar.hidden){sbar.hidden=false;searchBtn.setAttribute("aria-expanded","true")}
  if(hq.value!==sq)hq.value=sq;
  app.innerHTML=`<h1>البحث</h1><p class="lead">اكتب في خانة البحث فوق بالعربي أو بالألماني. الكلمة هتظهر بأداتها ومعناها ونطقها وجمل فيها.</p><div id="res"></div>`;
  drawResults();
}
function drawResults(){
  const R=$("#res");const nq=norm(sq);
  if(!nq){R.innerHTML=`<div class="empty">اكتب كلمة عشان تبدأ البحث.</div>`;return}
  const isAr=/[\u0600-\u06FF]/.test(sq);const hits=[];
  const seenW=new Set();ALLSRC().forEach(([lv,w])=>{const k=full(w);if(seenW.has(k))return;const ok=isAr?norm(w[2]).includes(nq):(norm(w[1]).includes(nq)||norm(full(w)).includes(nq));if(ok){seenW.add(k);hits.push({w,lv})}});
  hits.sort((a,b)=>(norm(isAr?a.w[2]:a.w[1]).startsWith(nq)?0:1)-(norm(isAr?b.w[2]:b.w[1]).startsWith(nq)?0:1));
  let html=hits.slice(0,20).map(({w,lv})=>{const ss=sentencesFor(w);return `<div class="result"><ul class="list" style="border:0;background:none">${wordRow(w,`<div style="margin-top:4px"><span class="badge">${lv}</span></div>`).replace(/<div class="ex">[\s\S]*?<\/div>/,"")}</ul>
    ${ss.length?`<p class="small muted" style="margin:8px 0 0">جمل فيها الكلمة:</p><ul class="sent">${ss.map(s=>`<li><span class="text-de">${esc(s.de)}</span> <button class="say" style="display:inline-grid;width:30px;height:30px;vertical-align:middle" data-say="${esc(s.de)}" aria-label="اسمع الجملة">${SPK}</button>${s.ar?`<br><span class="small">${esc(s.ar)}</span>`:""}</li>`).join("")}</ul>`:""}</div>`}).join("");
  if(!hits.length)html=`<div class="empty">الكلمة دي مش موجودة في كلمات المستويات.</div>`;
  if(sample){
    if(aiRes&&aiRes.found!==false){const a=aiRes;const w=[a.article==="der"?"m":a.article==="die"?"f":a.article==="das"?"n":"",a.de||"",a.ar||"",a.pron||"","",""];
      html+=`<div class="result"><p class="small muted" style="margin-top:0">نتيجة من المساعد الذكي${a.level?` · <span class="badge">${esc(a.level)}</span>`:""}</p><ul class="list" style="border:0;background:none">${wordRow(w)}</ul>${(a.sentences||[]).length?`<ul class="sent">${a.sentences.map(s=>`<li><span class="text-de">${esc(s.de||"")}</span> <button class="say" style="display:inline-grid;width:30px;height:30px;vertical-align:middle" data-say="${esc(s.de||"")}" aria-label="اسمع الجملة">${SPK}</button><br><span class="small">${esc(s.ar||"")}</span></li>`).join("")}</ul>`:""}</div>`}
    else if(aiRes&&aiRes.found===false)html+=`<p class="muted">المساعد الذكي ملقاش كلمة بالمعنى ده. اتأكد من الكتابة.</p>`;
    else html+=`<div class="row-btns"><button class="btn" id="ai" ${aiBusy?"disabled":""}>${aiBusy?"بيدور…":hits.length?"جمل وأمثلة أكتر من المساعد الذكي":"دوّر عليها مع المساعد الذكي"}</button></div>`;
    if(aiErr)html+=`<p class="err">${esc(aiErr)}</p>`;
  }
  R.innerHTML=html;bindSay(R);
  const ai=$("#ai");if(ai)ai.onclick=async()=>{
    aiBusy=true;aiErr="";drawResults();const term=sq;
    try{const j=await sample.json(`You are a German–Arabic learner's dictionary. The learner searched for: "${term}" (it may be Arabic or German). Find the best German word for it. Return ONLY JSON: {"found": true or false, "de": "German word (nouns singular, capitalized, WITHOUT article; verbs in infinitive)", "article": "der" or "die" or "das" or "" if not a noun, "ar": "short Arabic meaning", "pron": "German pronunciation written in Arabic letters", "level": "approx CEFR level like A1", "sentences": [{"de": "German sentence using the word", "ar": "Arabic translation"}] with exactly 4 natural sentences of increasing difficulty}`,{modelTier:"quick"});
      if(term===sq)aiRes=j}
    catch(e){aiErr=e&&e.code==="not_granted"?"لازم توافق على استخدام الذكاء الاصطناعي عشان البحث ده يشتغل.":"البحث مع المساعد الذكي مش متاح دلوقتي، جرّب بعد شوية."}
    aiBusy=false;if(view.name==="search"&&term===sq)drawResults();
  };
}

try{const th=localStorage.getItem("theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
{const p=parseHash(location.hash);if(location.hash)Object.assign(view,p);try{history.replaceState({y:0},"")}catch(e){}}
render();
if("speechSynthesis" in window){try{speechSynthesis.getVoices()}catch(e){}}
(async()=>{try{if(!(window.claude&&claude.use)&&typeof AI_ENDPOINT==="string"&&AI_ENDPOINT){sample=makeRemoteSample(AI_ENDPOINT);if(view.name==="search")drawResults();else if(view.name==="chat"||view.name==="photo")render();return}if(window.claude&&claude.use){sample=await claude.use("sample");if(sample&&view.name==="search")drawResults();else if(sample&&(view.name==="chat"||view.name==="photo"))render()}}catch(e){sample=null}})();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
